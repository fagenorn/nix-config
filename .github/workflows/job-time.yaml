# Files one issue when the .NET Solution job's median wall time over its last 10 green push runs
# of ci.yaml on main is not under its 240 s budget. It runs when a CI run on main completes, so
# the run it reads last has finished, and its job runs only when that run was a push, so a pull
# request's CI never reaches the issue writer. A workflow_run job runs this file as main holds it,
# with GITHUB_REF_NAME main. It reads the CI runs and their jobs (actions: read) and may write issues
# and nothing else; tests/test_job_time.py pins this file's shape. One concurrency group that cancels
# nothing and queues every waiting run runs readings one after another, so two never both find no
# open issue of this kind and file two. forge_api drops token variables, so the token is stored for
# gh before the command runs. The command exits 0 whatever it reads, and the job is no required context.
name: Job Time

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: job-time
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  job-time:
    name: Job Time
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Store the workflow token for gh
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s\n' "$TOKEN" | gh auth login --with-token --insecure-storage
      - name: Read the job time
        run: PYTHONPATH=python python3 -m agent_tools.delivery.job_time file --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"
