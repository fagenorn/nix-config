# Adapted from https://github.com/wimpysworld/nix-config/blob/main/.github/workflows/flake-checker.yml
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # l33t o'clock
    - cron: '37 13 * * *'
  workflow_dispatch:

# One run per pull request; a new push to a PR supersedes that PR's in-flight run.
# Every other trigger is keyed by event name *and* commit SHA. The SHA alone is not
# enough: the daily cron resolves `github.sha` to the tip of `main`, so a scheduled
# run would join the same group as that commit's own push run and evict it while it
# is still queued — and the cron skips `Nix Eval` (see below), leaving that commit
# with no reported result at all. Keying the event name in as well gives each
# commit's push run a group no other trigger can enter.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-checker:
    name: Flake Checker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v4
      - uses: DeterminateSystems/flake-checker-action@v5

  # `Nix Eval` is one of the three contexts `.github/branch-protection.json` requires on `main`
  # (the others are `Agent Workflow Tests`, below, and `Conformance`, in `conformance.yaml`) once
  # `just protect-main` has been applied. Renaming this job — or giving it a `strategy:` or a `uses:`, which
  # make GitHub report it under a different name — leaves that required context
  # unreportable and blocks every merge to `main` with no error pointing at the
  # cause. The inverse failure is quieter: a `needs:`, a `continue-on-error:`, or an
  # `if:` on a step lets the job report green without evaluating anything.
  # tests/test_branch_protection.py pins all of that against
  # .github/branch-protection.json; run that test module after editing either file.
  nix-eval:
    name: Nix Eval
    # The daily cron is flake-checker's; flake.lock is pinned, so a scheduled
    # re-evaluation of an unchanged tree is not expected to report anything the
    # push run did not already report (D5).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v4
      - name: Evaluate nixosConfigurations.anis-desktop
        run: |
          nix eval --show-trace \
            --extra-experimental-features 'nix-command flakes' \
            --raw '.#nixosConfigurations.anis-desktop.config.system.build.toplevel.drvPath'
      - name: Build the platform package
        run: nix build --no-link '.#packages.x86_64-linux.agent-platform'
      - name: Evaluate the macOS platform package
        run: nix eval --raw '.#packages.aarch64-darwin.agent-platform.drvPath'
      - name: Check the platform package runs with no home configuration
        run: nix build --no-link '.#checks.x86_64-linux.agent-platform'
      - name: Check oMLX adapter and host settings against pinned upstream
        run: nix build --no-link '.#checks.x86_64-linux.omlx-adapter'
      - name: Check the global agent corpus is project-agnostic
        run: nix build --no-link '.#checks.x86_64-linux.agnostic-lint'

  # The suite's shards: each runs the members SUITE_RUNNER_SHARD assigns it from the committed timings.
  # The matrix list is the one place the shard count is declared, and the join reads it from here.
  # fail-fast is off so that every shard finishes and reports its times and failures.
  agent-workflow-tests-shard:
    name: Agent Workflow Tests Shard ${{ matrix.shard }}
    # Hosted Ubuntu checks out sources but does not activate the managed local
    # skill surfaces, so the suite runs against the source surface.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history: suite modules build fixtures from pinned ancestor
        # commits and refuse to skip when one is missing.
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4
      - name: Run agent workflow tests
        # The hosted runner has 4 vCPUs. The runner writes this shard's suite time and every member's time,
        # slowest first, for the next step to upload (ADR-delivery-015).
        env:
          SUITE_RUNNER_JOBS: "4"
          SUITE_RUNNER_REPORT: suite-timing/suite-timing.json
          SUITE_RUNNER_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: WORKFLOW_POLICY_SURFACE=source nix shell --inputs-from . nixpkgs#just nixpkgs#nodejs --command just agent-workflow-tests
      # The one step if: a suite job may carry (ADR-delivery-015 D8): a completed red suite still uploads its times.
      # The name carries the attempt, so a rerun's report supersedes the earlier one, and the job's status here.
      - name: Upload shard timing
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-timing-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}-${{ job.status }}
          path: suite-timing/suite-timing.json
          if-no-files-found: error

  # The required context; everything the Nix Eval comment says applies here. It runs whatever the shards concluded,
  # because a job skipped after a failed need reports success to branch protection, and it fails naming each shard
  # that failed or wrote no report. It joins the shards' reports into the suite-timing artifact the jobs below read.
  agent-workflow-tests:
    name: Agent Workflow Tests
    needs: agent-workflow-tests-shard
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download shard timings
        uses: actions/download-artifact@v4
        with:
          pattern: suite-timing-shard-*
          path: suite-timing/shards
      - name: Join the shards
        env:
          SHARDS_RESULT: ${{ needs.agent-workflow-tests-shard.result }}
        run: PYTHONPATH=python python3 -m agent_tools.delivery.suite_timing join --workflow .github/workflows/ci.yaml --shard-job agent-workflow-tests-shard --shards-dir suite-timing/shards --out suite-timing/suite-timing.json --needs-result "$SHARDS_RESULT"
      - name: Upload suite timing
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-timing
          path: suite-timing/suite-timing.json
          if-no-files-found: error

  # Not required contexts (issue 1385, ADR-delivery-015). They read the report the
  # Agent Workflow Tests job uploaded. A green push to main keeps it in the Actions
  # cache as the baseline. A pull request compares its own report, from a green or a
  # red suite, with the baseline of its base commit, or else the newest one, and adds
  # one line to the run's summary. Neither job fails a run for a slower suite, and the
  # cache needs no token permission. The save and restore `path` must stay identical,
  # since the cache version is derived from it.
  suite-timing-baseline:
    name: Suite Timing Baseline
    needs: agent-workflow-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Download this run's suite timing
        uses: actions/download-artifact@v4
        with:
          name: suite-timing
          path: suite-timing/base
      - name: Keep it as the baseline
        uses: actions/cache/save@v4
        with:
          path: suite-timing/base/suite-timing.json
          key: suite-timing-${{ github.sha }}

  suite-timing:
    name: Suite Timing
    needs: agent-workflow-tests
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download this run's suite timing
        uses: actions/download-artifact@v4
        with:
          name: suite-timing
          path: suite-timing/head
      - name: Restore the baseline
        uses: actions/cache/restore@v4
        with:
          path: suite-timing/base/suite-timing.json
          key: suite-timing-${{ github.event.pull_request.base.sha }}
          restore-keys: suite-timing-
      - name: Compare with the baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: PYTHONPATH=python python3 -m agent_tools.delivery.suite_timing compare --head suite-timing/head/suite-timing.json --base suite-timing/base/suite-timing.json --base-label "$BASE_REF" >> "$GITHUB_STEP_SUMMARY"
