# Adapted from https://github.com/wimpysworld/nix-config/blob/main/.github/workflows/flake-checker.yml
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # l33t o'clock
    - cron: '37 13 * * *'
  workflow_dispatch:

# One run per pull request; a new push to a PR supersedes that PR's in-flight run.
# Every other trigger is keyed by event name *and* commit SHA. The SHA alone is not
# enough: the daily cron resolves `github.sha` to the tip of `main`, so a scheduled
# run would join the same group as that commit's own push run and evict it while it
# is still queued — and the cron skips `Nix Eval` (see below), leaving that commit
# with no reported result at all. Keying the event name in as well gives each
# commit's push run a group no other trigger can enter.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-checker:
    name: Flake Checker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v4
      - uses: DeterminateSystems/flake-checker-action@v5

  # `Nix Eval` is the context in `.github/branch-protection.json`'s sole
  # provider-bound check required on `main` once `just protect-main` has been
  # applied. Renaming this job — or giving it a `strategy:` or a `uses:`, which
  # make GitHub report it under a different name — leaves that required context
  # unreportable and blocks every merge to `main` with no error pointing at the
  # cause. The inverse failure is quieter: a `needs:`, a `continue-on-error:`, or an
  # `if:` on a step lets the job report green without evaluating anything.
  # tests/test_branch_protection.py pins all of that against
  # .github/branch-protection.json; run `just agent-workflow-tests` after editing
  # either file.
  nix-eval:
    name: Nix Eval
    # The daily cron is flake-checker's; flake.lock is pinned, so a scheduled
    # re-evaluation of an unchanged tree is not expected to report anything the
    # push run did not already report (D5).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v4
      - name: Evaluate nixosConfigurations.anis-desktop
        run: |
          nix eval --show-trace \
            --extra-experimental-features 'nix-command flakes' \
            --raw '.#nixosConfigurations.anis-desktop.config.system.build.toplevel.drvPath'

  agent-workflow-tests:
    name: Agent Workflow Tests (advisory)
    # Hosted Ubuntu checks out sources but does not activate the managed local
    # skill surfaces, so this advisory observation is explicitly source-only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Started
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
      - name: Install Nix
        id: install_nix
        continue-on-error: true
        uses: DeterminateSystems/nix-installer-action@v4
      - name: Provision just
        id: provision_just
        continue-on-error: true
        run: nix shell --inputs-from . nixpkgs#just --command just --version
      - name: Run agent workflow tests
        id: suite
        continue-on-error: true
        run: WORKFLOW_POLICY_SURFACE=source nix shell --inputs-from . nixpkgs#just --command just agent-workflow-tests
      - name: Record advisory observation
        if: always()
        run: |
          started="${{ steps.started.outputs.epoch }}"
          now="$(date +%s)"
          if [[ "$started" =~ ^[0-9]+$ ]]; then
            elapsed_seconds=$((now - started))
          else
            elapsed_seconds=0
          fi
          checkout="${{ steps.checkout.outcome }}"
          install_nix="${{ steps.install_nix.outcome }}"
          provision_just="${{ steps.provision_just.outcome }}"
          suite="${{ steps.suite.outcome }}"
          for raw_name in checkout install_nix provision_just suite; do
            [[ -n "${!raw_name}" ]] || printf -v "$raw_name" '%s' unknown
          done
          printf -v record 'AGENT_WORKFLOW_OBSERVATION_V1={"schema":"agent-workflow-observation/v1","trigger":"%s","raw":{"checkout":"%s","install_nix":"%s","provision_just":"%s","suite":"%s"},"elapsed_seconds":%s}' "${{ github.event_name }}" "$checkout" "$install_nix" "$provision_just" "$suite" "$elapsed_seconds"
          printf '%s\n' "$record" | tee -a "$GITHUB_STEP_SUMMARY"
