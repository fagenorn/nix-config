# Generated by resolve-project (project schema 2). Do not edit: the
# Conformance check fails while this file differs from what resolve-project renders.
name: Conformance

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4
      - name: Run conformance
        run: nix shell .#agent-platform --command conformance run --purpose ci
