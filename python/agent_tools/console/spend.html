<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Spend · Console</title>
<style>
:root {
  --base: #24273a; --mantle: #1e2030;
  --s0: #363a4f; --s1: #494d64; --s2: #5b6078;
  --text: #cad3f5; --sub1: #b8c0e0; --sub0: #a5adcb; --ov2: #939ab7;
  --crust: #181926; --lav: #b7bdf8;
  --hair: rgba(202, 211, 245, .09);
  --hover: rgba(202, 211, 245, .05);
  --ui: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter Variable", "Inter", system-ui, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Display", "Inter Variable", "Inter", system-ui, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--base); scrollbar-color: var(--s1) transparent; scrollbar-width: thin; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--base); color: var(--text);
  font: 400 .9375rem/1.5 var(--ui); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
h1, h2, p, ul { margin: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; border-radius: 6px; }
/* controls */
.btn-primary, .btn-quiet, .btn-danger, .btn-option { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 5px 12px; font: 500 .875rem/1.4 var(--ui); text-align: left; text-decoration: none; color: var(--sub1); background: none; border: 1px solid var(--s1); border-radius: 8px; cursor: pointer; transition: background-color .16s, border-color .16s; }
.btn-primary { min-height: 40px; padding: 0 16px; font-weight: 600; }
.btn-option { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 14px; width: 100%; min-height: 44px; padding: 9px 14px; color: var(--text); border-color: transparent; }
.btn-option kbd { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1px solid var(--s2); border-radius: 6px; font: inherit; font-size: .75rem; font-weight: 600; color: var(--sub1); }
.btn-bare { padding: 0; border-color: transparent; background: none; }
.field-line, .field-area, .field-code { min-height: 32px; padding: 5px 10px; font: 400 .875rem/1.4 var(--ui); color: var(--text); background: var(--mantle); border: 1px solid var(--s1); border-radius: 8px; }
.field-area { display: block; width: 100%; min-height: 4.5rem; resize: vertical; }
.field-code { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: .06em; }
.field-bare { padding-left: 0; padding-right: 0; background: none; border-color: transparent; }
.field-line::placeholder, .field-area::placeholder, .field-code::placeholder { color: var(--ov2); opacity: 1; }
.btn-primary:disabled, .btn-primary[aria-disabled="true"], .btn-quiet:disabled, .btn-quiet[aria-disabled="true"], .btn-danger:disabled, .btn-danger[aria-disabled="true"], .btn-option:disabled, .btn-option[aria-disabled="true"], .field-line:disabled, .field-line[aria-disabled="true"], .field-area:disabled, .field-area[aria-disabled="true"], .field-code:disabled, .field-code[aria-disabled="true"] { border-width: 1px; border-style: dashed; border-color: var(--s1); cursor: not-allowed; opacity: .55; }
.btn-primary[aria-busy="true"], .btn-quiet[aria-busy="true"], .btn-danger[aria-busy="true"], .btn-option[aria-busy="true"], .field-line[aria-busy="true"], .field-area[aria-busy="true"], .field-code[aria-busy="true"] { border-width: 1px; border-style: dotted; cursor: progress; }
.btn-primary[aria-busy="true"]::after, .btn-quiet[aria-busy="true"]::after, .btn-danger[aria-busy="true"]::after { content: "\2026"; }
.btn-quiet:hover:not(:disabled):not([aria-disabled="true"]), .btn-danger:hover:not(:disabled):not([aria-disabled="true"]), .btn-option:hover:not(:disabled):not([aria-disabled="true"]) { background: var(--hover); border-color: var(--s2); }
.btn-quiet.btn-bare:hover:not(:disabled):not([aria-disabled="true"]) { border-color: transparent; }
.btn-primary:active, .btn-quiet:active, .btn-danger:active, .btn-option:active { transform: translateY(1px); }
.btn-primary[aria-pressed="true"], .btn-quiet[aria-pressed="true"], .btn-danger[aria-pressed="true"], .btn-option[aria-pressed="true"] { border-color: var(--lav); font-weight: 600; }
.btn-primary:focus-visible, .btn-quiet:focus-visible, .btn-danger:focus-visible, .btn-option:focus-visible, .field-line:focus-visible, .field-area:focus-visible, .field-code:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; border-radius: 8px; }
.field-bare:focus-visible { outline: none; }
/* end controls */
.top { position: sticky; top: 0; z-index: 10; background: var(--base); border-bottom: 1px solid var(--hair); }
.top-in { max-width: 1360px; margin: 0 auto; padding: 8px 48px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; min-height: 56px; }
.brand { font-weight: 600; color: var(--sub1); white-space: nowrap; letter-spacing: -.005em; }
.conn { color: var(--ov2); font-size: .8125rem; }
.nav { color: var(--sub0); font-size: .8125rem; text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; min-height: 24px; }
.nav:hover { color: var(--text); }
main.spend { max-width: 1360px; margin: 0 auto; padding: 30px 48px 72px; }
main.spend h1 { font: 600 1.375rem/1.3 var(--display); color: var(--text); }
.empty { color: var(--sub0); }
.spans { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.span { white-space: nowrap; }
.estimate-note { margin-top: 12px; color: var(--ov2); font-size: .8125rem; }
#summary { display: flex; flex-wrap: wrap; gap: 16px 56px; margin-top: 28px; }
.figure { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.figure-label { color: var(--sub0); font-size: .8125rem; }
.figure .usd { font: 600 2rem/1.2 var(--display); color: var(--text); }
.approx { color: var(--ov2); font-size: .8125rem; }
.tokens { color: var(--ov2); font-size: .8125rem; }
.trend { list-style: none; margin: 32px 0 0; padding: 0; display: flex; gap: 6px; }
.trend-day { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.trend-bar { display: flex; align-items: flex-end; height: 120px; background: var(--s1); border-radius: 4px; overflow: hidden; }
.trend-bar i { display: block; width: 100%; background: var(--sub0); }
.trend-label { color: var(--ov2); font-size: .75rem; line-height: 1.4; min-height: 1.4em; text-align: center; white-space: nowrap; }
.trend-day:first-child .trend-label { text-align: left; }
.trend-day:last-child .trend-label { display: flex; justify-content: flex-end; }
.breakdown { margin-top: 36px; }
.breakdown h2 { font-size: .9375rem; font-weight: 600; line-height: 1.4; color: var(--text); }
.rows { list-style: none; margin: 8px 0 0; padding: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 16px; padding: 10px 0; border-top: 1px solid var(--hair); }
.row-name { overflow-wrap: anywhere; min-width: 0; }
.row .usd, .row .approx { grid-column: 2; text-align: right; }
.row .tokens { grid-column: 1 / -1; }
@media (max-width: 480px) {
  .top-in { padding: 10px 16px; gap: 10px 16px; flex-wrap: wrap; }
  main.spend { padding: 24px 16px 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="brand">Console</span><a class="nav" href="/">Desk</a><span class="conn" id="conn" role="status">Reconnecting…</span></div></header>
<main class="spend">
<h1>Spend</h1>
<div class="spans" id="spans" role="group" aria-label="Span"></div>
<p class="estimate-note" id="note"></p>
<section id="item" aria-label="Opened item"></section>
<section id="summary" aria-label="Total"></section>
<section id="trend" aria-label="Per day"></section>
<section id="breakdowns" aria-label="Breakdowns"></section>
</main>
<script>
const SPANS = [["Today", 1], ["7 days", 7], ["30 days", 30]];
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DIMENSIONS = [
  ["project", "By project"], ["sprint", "By sprint"], ["phase", "By phase"],
  ["account", "By account"], ["aspect", "By aspect"],
];
const ASPECTS = {
  managers: "Managers", deliveries: "Deliveries", outside_sprint: "Outside-sprint sessions",
  questions: "Questions", keepalive: "Keepalive pings", unattributed: "unattributed",
};
const state = {span: 7, view: null};

function zero() {
  return {input: 0, cache_write: 0, cache_read: 0, output: 0, dollars: 0, approximate: false};
}
function add(total, part) {
  total.input += part.input;
  total.cache_write += part.cache_write;
  total.cache_read += part.cache_read;
  total.output += part.output;
  total.dollars += part.dollars;
  total.approximate = total.approximate || Boolean(part.approximate);
  return total;
}
function sum(list) {
  const total = zero();
  for (const part of list) add(total, part);
  return total;
}
function usd(dollars) {
  const parts = dollars.toFixed(2).split(".");
  return "~$" + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + parts[1];
}
function count(n) {
  if (n < 1000) return String(Math.round(n));
  const scale = n < 1e6 ? [1e3, "k"] : n < 1e9 ? [1e6, "M"] : [1e9, "B"];
  return (n / scale[0]).toFixed(1).replace(/\.0$/, "") + scale[1];
}
function tokensText(t) {
  return "input " + count(t.input) + " · cache writes " + count(t.cache_write) +
    " · cache reads " + count(t.cache_read) + " · output " + count(t.output);
}
function dayLabel(day, isToday) {
  if (isToday) return "Today";
  const parts = day.split("-").map(Number);
  const at = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
  return WEEKDAYS[at.getUTCDay()] + " " + at.getUTCDate() + " " + MONTHS[at.getUTCMonth()];
}
function sprintTitles(entries) {
  const titles = new Map();
  for (const entry of entries || []) {
    const projects = entry.type === "quiet_group" ? (entry.projects || []) : [entry];
    for (const project of projects) {
      const finished = project.finished_sprints ? (project.finished_sprints.sprints || []) : [];
      for (const sprint of (project.sprints || []).concat(finished)) {
        titles.set(sprint.sprint_id, sprint.title);
      }
    }
  }
  return titles;
}
function rowName(dimension, key, titles) {
  if (key === "unattributed") return "unattributed";
  if (dimension === "sprint") return titles.get(key) || "sprint " + key.slice(0, 8);
  if (dimension === "aspect") return Object.prototype.hasOwnProperty.call(ASPECTS, key) ? ASPECTS[key] : key;
  return key;
}
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function usdNode(dollars) {
  const node = el("span", "usd", usd(dollars));
  node.title = "Estimated at API list prices";
  return node;
}
function figure(label, total) {
  const node = el("div", "figure");
  node.appendChild(el("span", "figure-label", label));
  node.appendChild(usdNode(total.dollars));
  if (total.approximate) node.appendChild(el("span", "approx", "approximate"));
  node.appendChild(el("p", "tokens", tokensText(total)));
  return node;
}
function trendList(days, last) {
  const top = Math.max(0, ...days.map((day) => day.total.dollars));
  const list = el("ol", "trend");
  days.forEach((day, at) => {
    const label = dayLabel(day.day, day === last);
    const item = el("li", "trend-day");
    item.title = label + ": " + usd(day.total.dollars) + (day.total.approximate ? ", approximate" : "");
    const bar = el("span", "trend-bar");
    const fill = document.createElement("i");
    fill.style.height = (top === 0 ? 0 : Math.round(day.total.dollars / top * 100)) + "%";
    bar.appendChild(fill);
    item.appendChild(bar);
    const edge = at === 0 || at === days.length - 1;
    item.appendChild(el("span", "trend-label", state.span === 30 && !edge ? "" : label));
    list.appendChild(item);
  });
  return list;
}
function breakdown(heading, dimension, days, titles) {
  const section = el("section", "breakdown");
  section.appendChild(el("h2", "", heading));
  const sums = new Map();
  for (const day of days) {
    const keyed = day[dimension] || {};
    for (const key of Object.keys(keyed)) {
      if (!sums.has(key)) sums.set(key, zero());
      add(sums.get(key), keyed[key]);
    }
  }
  const rows = [...sums].map(([key, total]) => ({name: rowName(dimension, key, titles), total}));
  rows.sort((a, b) => (b.total.dollars - a.total.dollars) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
  if (rows.length === 0) {
    section.appendChild(el("p", "empty", "Nothing in this span."));
    return section;
  }
  const list = el("ol", "rows");
  for (const row of rows) {
    const item = el("li", "row");
    item.appendChild(el("span", "row-name", row.name));
    item.appendChild(usdNode(row.total.dollars));
    if (row.total.approximate) item.appendChild(el("span", "approx", "approximate"));
    item.appendChild(el("span", "tokens", tokensText(row.total)));
    list.appendChild(item);
  }
  section.appendChild(list);
  return section;
}
function itemOf(hash) {
  const found = /^#(sprint|run)=(.+)$/.exec(hash || "");
  if (!found) return null;
  try {
    return {kind: found[1], id: decodeURIComponent(found[2])};
  } catch (error) {
    return null;
  }
}
function itemSection(view, opened, titles) {
  const kind = opened.kind;
  const section = el("section", "breakdown item");
  section.appendChild(el("h2", "", kind === "sprint" ? rowName("sprint", opened.id, titles) : "Run " + opened.id));
  const days = view.spend.days || [];
  const holds = (group, id) => Boolean(group) && Object.prototype.hasOwnProperty.call(group, id);
  const own = days.filter((day) => holds(day[kind], opened.id));
  const total = sum(own.map((day) => day[kind][opened.id]));
  if (own.length === 0 || total.input + total.cache_write + total.cache_read + total.output === 0) {
    section.appendChild(el("p", "empty", "Nothing for this " + kind + " in the last 30 days."));
    return section;
  }
  section.appendChild(figure("So far, last 30 days", total));
  const sums = new Map();
  for (const day of days) {
    const group = day[kind + "_phase"];
    const phases = holds(group, opened.id) ? group[opened.id] : {};
    for (const phase of Object.keys(phases)) {
      if (!sums.has(phase)) sums.set(phase, zero());
      add(sums.get(phase), phases[phase]);
    }
  }
  const rows = [...sums].map(([phase, part]) => ({name: phase === "manager" ? "Manager" : phase, part}));
  rows.sort((a, b) => (b.part.dollars - a.part.dollars) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
  const list = el("ol", "rows");
  for (const row of rows) {
    const item = el("li", "row");
    item.appendChild(el("span", "row-name", row.name));
    item.appendChild(usdNode(row.part.dollars));
    if (row.part.approximate) item.appendChild(el("span", "approx", "approximate"));
    item.appendChild(el("span", "tokens", tokensText(row.part)));
    list.appendChild(item);
  }
  section.appendChild(list);
  return section;
}
function showPressed() {
  for (const button of document.getElementById("spans").children) {
    button.setAttribute("aria-pressed", String(Number(button.dataset.span) === state.span));
  }
}
function render(view) {
  state.view = view;
  showPressed();
  const note = document.getElementById("note");
  const summary = document.getElementById("summary");
  const trend = document.getElementById("trend");
  const breakdowns = document.getElementById("breakdowns");
  const item = document.getElementById("item");
  const opened = itemOf(window.location.hash);
  if (view.spend === null || view.spend === undefined) {
    note.textContent = "";
    item.replaceChildren();
    summary.replaceChildren(el("p", "empty", "Spend shows once the console has read the transcripts."));
    trend.replaceChildren();
    breakdowns.replaceChildren();
    return;
  }
  const all = view.spend.days || [];
  const days = all.slice(Math.max(0, all.length - state.span));
  const last = all[all.length - 1];
  const total = sum(days.map((day) => day.total));
  note.textContent = "Dollar figures (~) are estimates at API list prices." +
    (total.approximate ? " Some are approximate: a model without its own price row is priced like its family." : "");
  const figures = [figure("Today", last ? last.total : zero())];
  if (state.span > 1) figures.push(figure("Last " + state.span + " days", total));
  summary.replaceChildren(...figures);
  trend.replaceChildren(trendList(days, last));
  const titles = sprintTitles(view.entries);
  item.replaceChildren(...(opened ? [itemSection(view, opened, titles)] : []));
  breakdowns.replaceChildren(...DIMENSIONS.map(([dimension, heading]) => breakdown(heading, dimension, days, titles)));
}
for (const [text, span] of SPANS) {
  const button = el("button", "span btn-quiet", text);
  button.setAttribute("type", "button");
  button.dataset.span = String(span);
  button.addEventListener("click", () => {
    state.span = span;
    if (state.view) render(state.view); else showPressed();
  });
  document.getElementById("spans").appendChild(button);
}
showPressed();
window.addEventListener("hashchange", () => { if (state.view) render(state.view); });
const conn = document.getElementById("conn");
const source = new EventSource("/api/stream");
source.addEventListener("view", (event) => render(JSON.parse(event.data)));
source.onopen = () => { conn.textContent = ""; };
source.onerror = () => { conn.textContent = "Reconnecting…"; };
</script>
</body>
</html>
