// One entry's row. A fold entry is a quiet pick button until its change opens; every other entry has its own Change control.

// Cancel registration: one post at a time; the refusal's text is the console's own and lasts as long as the registration it answered.

// The registration's words are the view's: the page shows them verbatim and composes none.

// Swaps parts and updates the disabled state and reason; it never replaces the path field.

renderRegister(null);
let goalPanel = null;

const token = document.getElementById("console-token").content;
