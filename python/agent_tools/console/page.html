      event.preventDefault();
      redraw();
    } else if (draft.open) {
      event.preventDefault();
      closeGoal();
    }
    return;
  }
  const focused = event.target && event.target.tagName;
  // A card focused by its sprint's check line (openCheckCard) is ARTICLE or LI: the answer keys stay with it, not with the unrelated item currentEntry would pick.
  if (["A", "BUTTON", "SUMMARY", "INPUT", "TEXTAREA", "SELECT", "ARTICLE", "LI"].includes(focused)) return;
  if (event.target && event.target.isContentEditable === true) return;
  if (event.key === "a") {
    openAccounts();
    event.preventDefault();
    return;
  }
  if (event.key === "g") {
    openGoal();
    event.preventDefault();
    return;
  }
  // The reading panel's heading takes focus when a thread opens: its keys are not the inbox's answer keys, so Enter there never approves an unrelated brief.
  if (inReadingPanel(event.target)) return;
  const current = currentEntry(lastView.inbox.open);
  if (current === null) return;
  const { item, state } = current;
  if (event.key === "Enter") {
    if (textCard(item)) {
      const key = itemId(item) + "\ndraft";
      const typed = draftOf(key).value.trim();
      if (typed !== "") {
        if (startDraft(item, state, typed)) {
          event.preventDefault();
          redraw();
        }
      } else if (item.questions.length > 0 && picksComplete(item, state)) {
        if (start(item, state)) {
          event.preventDefault();
          redraw();
        }
      } else {
        const field = fields.get(key);
        if (field !== undefined) field.focus();
        event.preventDefault();
      }
    } else if (isBrief(item) ? startApproval(item, state) : start(item, state)) {
      event.preventDefault();
      redraw();
    }
  } else if (/^[1-9]$/.test(event.key)) {
    if (isBrief(item) || item.questions.length === 0) return;
    const qi = Math.min(state.q, item.questions.length - 1);
    const oi = Number(event.key) - 1;
    if (oi >= item.questions[qi].options.length) return;
    choose(state, qi, oi);
    state.q = Math.min(qi + 1, item.questions.length - 1);
    event.preventDefault();
    redraw();
  }
});
const conn = document.getElementById("conn");
const source = new EventSource("/api/stream");
source.addEventListener("view", (event) => {
  settleBroken = true;
  try {
    render(JSON.parse(event.data));
  } finally {
    settleBroken = false;
  }
});
source.onopen = () => { conn.textContent = ""; };
source.onerror = () => {
  conn.textContent = "Reconnecting…";
  // What was accepted before the break is in the log the next frame reads: a row it lacks was deleted in another tab.
  for (const sent of [...askSent.values(), ...followSent.values()]) {
    for (const submission of sent.list) submission.broke = true;
  }
};
</script>
