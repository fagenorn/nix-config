<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="console-token" id="console-token" content="__CONSOLE_TOKEN__">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Console</title>
<style>
:root {
  --base: #24273a; --mantle: #1e2030;
  --s1: #494d64; --s2: #5b6078;
  --text: #cad3f5; --sub1: #b8c0e0; --sub0: #a5adcb; --ov2: #939ab7;
  --peach: #f5a97f; --lav: #b7bdf8;
  --green: #a6da95; --yellow: #eed49f; --red: #ed8796;
  --hair: rgba(202, 211, 245, .09);
  --ui: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter Variable", "Inter", system-ui, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Display", "Inter Variable", "Inter", system-ui, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--base); scrollbar-color: var(--s1) transparent; scrollbar-width: thin; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--base); color: var(--text);
  font: 400 .9375rem/1.5 var(--ui); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
h1, h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; border-radius: 6px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; align-self: center; }

.top { position: sticky; top: 0; z-index: 10; background: var(--base); border-bottom: 1px solid var(--hair); }
.top-in { max-width: 1360px; margin: 0 auto; padding: 8px 48px; display: flex; align-items: center; gap: 28px; min-height: 56px; }
.brand { font-weight: 600; color: var(--sub1); white-space: nowrap; letter-spacing: -.005em; }
.conn { color: var(--ov2); font-size: .8125rem; }
.cap { display: flex; flex-wrap: wrap; gap: 2px 20px; margin-left: auto; font-size: .8125rem; color: var(--sub0); }
.cap-p { display: inline-flex; gap: 6px; }
.cap-p b { font-weight: 600; }
.cap-out { color: var(--red); }
.cap-tight { color: var(--yellow); }

.desk-grid { max-width: 1360px; margin: 0 auto; padding: 30px 48px 72px; display: grid; grid-template-columns: minmax(0, 1fr) 460px; column-gap: 88px; align-items: start; }

.statement h1 { font: 650 3.5rem/1.04 var(--display); letter-spacing: -.028em; text-wrap: balance; }
.statement .sub { margin-top: 16px; font-size: 1.125rem; line-height: 1.5; color: var(--sub1); max-width: 44rem; text-wrap: pretty; }
.statement h1.needs { color: var(--peach); }

#inbox { margin-top: 40px; max-width: 44rem; }
.card { padding: 0 0 18px; }
.card h2 { font: 600 .9375rem/1.4 var(--ui); display: flex; align-items: baseline; gap: 10px; }
.card h2 span { font-weight: 400; font-size: .8125rem; color: var(--ov2); }
.card .ask { margin-top: 6px; font-size: 1.0625rem; color: var(--text); }
.card .opts { margin-top: 6px; padding-left: 18px; list-style: disc; color: var(--sub0); font-size: .84375rem; }
.rest .opts, .done .opts { flex-basis: 100%; margin: 0; padding-left: 18px; list-style: disc; color: var(--sub0); font-size: .84375rem; }
.rest .meta, .done .meta { flex-basis: 100%; margin: 0; font-size: .8125rem; color: var(--ov2); }
.card .opts .picked, .rest .opts .picked, .done .opts .picked { color: var(--lav); }
.card .meta { margin-top: 8px; font-size: .8125rem; color: var(--ov2); }
.rest, .done { margin-top: 10px; }
.rest li, .done li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 5px 0; font-size: .875rem; color: var(--ov2); }
.rest b, .done b { font-weight: 600; color: var(--sub0); }
.abox { flex-basis: 100%; margin-top: 6px; }
.abox .meta { margin-top: 6px; }
.abox .meta.now { color: var(--text); }
.abox .opts { list-style: none; padding-left: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 4px; }
.opt, .send, .undo, .goal-open, .goal-send, .goal-cancel, .goal-project, .withdraw { display: inline-flex; align-items: baseline; gap: 8px; font: inherit; color: inherit; text-align: left; background: none; border: 1px solid var(--hair); border-radius: 8px; padding: 2px 10px; cursor: pointer; transition: background-color .16s; }
.opt:hover:enabled, .send:hover:enabled, .undo:hover:enabled, .goal-open:hover:enabled, .goal-send:hover:enabled, .goal-cancel:hover:enabled, .goal-project:hover:enabled, .withdraw:hover:enabled { background: rgba(202, 211, 245, .05); }
.opt:disabled, .send:disabled, .goal-send:disabled, .withdraw:disabled { cursor: default; }
.opt kbd { font: inherit; color: var(--ov2); }
.opt.picked, .goal-project.picked { color: var(--lav); border-color: var(--lav); }
#goal { margin-top: 24px; max-width: 44rem; }
.goal-box { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.goal-filter, .goal-text { width: 100%; font: inherit; color: var(--text); background: var(--mantle); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 10px; }
.goal-text { min-height: 6em; resize: vertical; }
.goal-projects { display: flex; flex-wrap: wrap; gap: 4px; }
.goal-status:empty { display: none; }
.goal-act { display: flex; gap: 8px; }
.sprints { flex: 1 0 100%; padding: 0 0 0 16px; }
.sprint { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: .8125rem; color: var(--sub0); }
.sprint .goal-line { color: var(--text); overflow-wrap: anywhere; }
.sprint .age, .sprint .manager { color: var(--ov2); }
.act { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 8px; font-size: .8125rem; color: var(--ov2); }
.fail { color: var(--red); }
.done-head { margin-top: 24px; font: 600 .875rem/1.4 var(--ui); color: var(--ov2); }
#digest { margin-top: 40px; max-width: 44rem; }
#digest:empty { margin-top: 0; }
.digest-head { font: 600 .875rem/1.4 var(--ui); color: var(--ov2); }
.digest, .earlier-list { margin-top: 6px; }
.digest li, .earlier-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 5px 0; font-size: .875rem; color: var(--sub0); }
.digest .at { color: var(--ov2); }
.earlier { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); }
.earlier summary { display: flex; align-items: baseline; gap: 8px; cursor: pointer; list-style: none; padding: 4px 12px; margin: 0 -12px; border-radius: 10px; font-size: .875rem; color: var(--ov2); transition: background-color .16s; }
.earlier summary::-webkit-details-marker { display: none; }
.earlier summary:hover { background: rgba(202, 211, 245, .05); }
.earlier summary b { font-weight: 600; color: var(--sub0); }
.answer { color: var(--lav); text-underline-offset: 3px; }
.side { margin-top: 12px; }
.side h2 { font: 600 .9375rem/1.4 var(--ui); display: flex; align-items: baseline; gap: 10px; }
.side h2 span { font-weight: 400; font-size: .8125rem; color: var(--ov2); }
.empty { margin-top: 12px; color: var(--sub0); font-size: .84375rem; }
#list { margin-top: 12px; }
.line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 5px 0; font-size: .875rem; color: var(--ov2); }
.line b { font-weight: 600; color: var(--sub0); }
.line .root { overflow-wrap: anywhere; }
.line .qw { display: inline-flex; align-items: baseline; gap: 6px; }
.quietfold { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--hair); }
.quietfold summary { display: flex; align-items: baseline; gap: 8px; cursor: pointer; list-style: none; padding: 4px 12px; margin: 0 -12px; border-radius: 10px; font-size: .875rem; color: var(--ov2); transition: background-color .16s; }
.quietfold summary::-webkit-details-marker { display: none; }
.quietfold summary:hover { background: rgba(202, 211, 245, .05); }
.quietfold summary b { font-weight: 600; color: var(--sub0); }
.quietfold ul { margin-top: 4px; padding: 0 0 0 22px; }
.line .untouched { font-size: .8125rem; }
.outside { flex: 1 0 100%; font-size: .8125rem; }
.outside summary { cursor: pointer; color: var(--ov2); }
.outside summary b { font-weight: 600; color: var(--sub0); }
.outside ul { margin-top: 2px; padding: 0 0 0 16px; }
.outside li { display: flex; flex-wrap: wrap; gap: 0 10px; color: var(--sub0); }
.outside .runs { flex: 1 0 100%; margin-top: 0; padding: 0 0 0 16px; }
.run { display: flex; flex-wrap: wrap; gap: 0 10px; }
.run .stage { color: var(--sub0); }
.run .moved { color: var(--ov2); }
.s-working { color: var(--green); }
.s-waiting_answer, .s-waiting_permission { color: var(--yellow); }
.s-limit { color: var(--red); }
.s-idle { color: var(--ov2); }
#unmanaged { margin-top: 24px; }

@media (max-width: 1180px) {
  .desk-grid { grid-template-columns: minmax(0, 1fr) 400px; column-gap: 56px; }
}
@media (max-width: 900px) {
  .desk-grid { grid-template-columns: minmax(0, 1fr); padding: 32px 16px 56px; }
  .top-in { padding: 10px 16px; gap: 10px 16px; }
  .side { margin-top: 48px; }
  .statement h1 { font-size: 2.375rem; letter-spacing: -.022em; }
  .statement .sub { font-size: 1rem; }
}
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="brand">Console</span><span class="cap" id="capacity"></span><span class="conn" id="conn" role="status">Reconnecting…</span></div></header>
<div class="desk-grid">
<main>
<div class="statement" id="statement"></div>
<section id="goal" aria-label="Goal"></section>
<section id="promoted" aria-label="Capacity"></section>
<section id="inbox" aria-label="Inbox"></section>
<section id="digest" aria-label="Since you last looked"></section>
</main>
<aside class="side" aria-label="Projects">
<section id="projects"></section>
<section id="unmanaged"></section>
</aside>
</div>
<template id="quiet-icon"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 9.5A5 5 0 0 1 6.5 3.5a5 5 0 1 0 6 6z"/></svg></template>
<script>
"use strict";
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function quietIcon() {
  return document.getElementById("quiet-icon").content.firstElementChild.cloneNode(true);
}
function outsideFold(outside, key) {
  const fold = el("details", "outside");
  fold.dataset.key = key;
  const summary = el("summary");
  summary.appendChild(el("b", "", outside.label));
  summary.appendChild(el("span", "", " " + outside.summary));
  fold.appendChild(summary);
  const list = el("ul");
  for (const session of outside.sessions) {
    const row = el("li");
    row.appendChild(el("span", "", session.name));
    row.appendChild(el("span", "s-" + session.state, session.state_text));
    const runs = session.deliveries || [];
    if (runs.length) {
      const runList = el("ul", "runs");
      for (const run of runs) {
        const item = el("li", "run");
        for (const issue of run.issues) {
          item.appendChild(el("span", "issue", "#" + issue.issue));
          item.appendChild(el("span", "stage", issue.stage_text));
        }
        item.appendChild(el("span", run.quiet ? "moved quiet" : "moved", run.moved_text));
        runList.appendChild(item);
      }
      row.appendChild(runList);
    }
    list.appendChild(row);
  }
  fold.appendChild(list);
  return fold;
}
function untouchedDays(lastActivity) {
  const days = Math.floor((Date.now() - Date.parse(lastActivity)) / 86400000);
  return Number.isFinite(days) && days >= 1 ? days : 0;
}
const withdrawals = new Map();
const latestSprints = new Map();
function fillSprint(item, entry, sprint) {
  const state = withdrawals.get(sprint.sprint_id);
  latestSprints.set(sprint.sprint_id, { entry, sprint });
  item.dataset.sprintId = sprint.sprint_id;
  item.replaceChildren();
  item.appendChild(el("span", "goal-line", sprint.goal));
  item.appendChild(el("span", "sprint-state", sprint.state_text));
  item.appendChild(el("span", "age", sprint.age_text));
  if (sprint.manager_text !== null && sprint.manager_text !== undefined) {
    item.appendChild(el("span", "manager", sprint.manager_text));
  }
  const button = actionButton("withdraw", "Withdraw", () => withdraw(item, entry, sprint));
  if (state !== undefined && state.phase === "sending") button.setAttribute("disabled", "");
  item.appendChild(button);
  if (state !== undefined && state.phase === "failed") {
    item.appendChild(el("span", "fail", "Could not withdraw: " + state.reason));
  }
}
async function withdraw(item, entry, sprint) {
  const id = sprint.sprint_id;
  const current = withdrawals.get(id);
  if (current !== undefined && current.phase === "sending") return;
  const state = { phase: "sending", reason: "" };
  withdrawals.set(id, state);
  fillSprint(item, entry, sprint);
  let reason = null;
  try {
    const response = await fetch("/api/withdraw", {
      method: "POST",
      headers: { "X-Console-Token": token, "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: entry.project_id, sprint_id: id }),
    });
    if (response.status !== 204) {
      reason = (await response.text()).trim() || "HTTP " + response.status;
    }
  } catch (error) {
    console.error(error);
    reason = "the console did not answer";
  }
  if (withdrawals.get(id) !== state) return;
  if (reason === null) withdrawals.delete(id);
  else {
    state.phase = "failed";
    state.reason = reason;
  }
  const latest = latestSprints.get(id);
  for (const row of document.querySelectorAll("li.sprint")) {
    if (row.dataset.sprintId === id) fillSprint(row, latest.entry, latest.sprint);
  }
}
function sprintList(entry) {
  const list = el("ul", "sprints");
  for (const sprint of entry.sprints) {
    const item = el("li", "sprint");
    fillSprint(item, entry, sprint);
    list.appendChild(item);
  }
  return list;
}
function projectLine(entry) {
  const line = el("li", "line");
  line.appendChild(el("b", "", entry.project_id));
  if (entry.quiet) {
    const quiet = el("span", "qw");
    quiet.appendChild(quietIcon());
    quiet.appendChild(el("span", "", "quiet"));
    line.appendChild(quiet);
  }
  line.appendChild(el("span", "root", entry.root));
  if (entry.quiet) {
    const days = untouchedDays(entry.last_activity);
    if (days > 0) line.appendChild(el("span", "untouched", "untouched for " + days + (days === 1 ? " day" : " days")));
  }
  if (entry.outside_sprints.sessions.length > 0) {
    line.appendChild(outsideFold(entry.outside_sprints, "outside:" + entry.project_id));
  }
  if (entry.sprints && entry.sprints.length > 0) line.appendChild(sprintList(entry));
  return line;
}
function renderStatement(view) {
  const box = document.getElementById("statement");
  const h1 = el("h1", view.statement.inbox_items > 0 ? "needs" : "", view.statement.headline);
  const nodes = [h1, el("p", "sub", view.statement.sentence)];
  const cap = view.capacity;
  if (cap && cap.all_out && cap.resumes_at) nodes.push(el("p", "sub", "Resumes at " + when(cap.resumes_at)));
  box.replaceChildren(...nodes);
}
function when(stamp) {
  return new Date(stamp).toLocaleString();
}
function outWords(p) {
  return p.out_until === null || p.out_until === undefined ? "out, reset unknown" : "out until " + when(p.out_until);
}
function capacityWords(p) {
  if (p.state === "unknown") return "no reading yet";
  if (p.state === "out") return outWords(p);
  if (p.state === "reset") return "reset, not yet used";
  const has = (v) => v !== null && v !== undefined;
  let words = has(p.week_left) ? p.week_left + "% of the week left" : "week unknown";
  if (has(p.five_hour_left)) words += " \u00b7 " + p.five_hour_left + "% of 5 hours";
  if (has(p.next_reset)) words += " \u00b7 resets " + when(p.next_reset);
  return words;
}
function renderCapacity(view) {
  const box = document.getElementById("capacity");
  const cap = view.capacity || {profiles: []};
  const nodes = [];
  for (const p of cap.profiles) {
    const span = el("span", "cap-p");
    span.appendChild(el("b", "", p.profile));
    span.appendChild(el("span", p.state === "out" ? "cap-out" : "", capacityWords(p)));
    nodes.push(span);
  }
  if (cap.tight) nodes.push(el("span", "cap-tight", "tight"));
  box.replaceChildren(...nodes);
}
function renderPromoted(view) {
  const box = document.getElementById("promoted");
  const cap = view.capacity || {profiles: []};
  box.replaceChildren();
  if (!cap.all_out) return;
  const list = el("ul");
  for (const p of cap.profiles) list.appendChild(el("li", "cap-out", p.profile + " " + outWords(p)));
  box.appendChild(el("h2", "", "Capacity"));
  box.appendChild(list);
}
function holds(item) {
  return item.held_work === 1 ? "holds 1 issue" : "holds " + item.held_work + " issues";
}
function answerLink(item) {
  const a = el("a", "answer", "Answer on the tracker");
  a.href = item.url;
  a.rel = "noreferrer";
  return a;
}
function metaLine(item) {
  let text = "waiting since " + when(item.waiting_since) + " \u00b7 " + holds(item);
  if (item.stale) text += " \u00b7 read at " + when(item.read_at);
  return text;
}
function appendDetail(node, item) {
  if (item.questions.length > 0) {
    const state = answerable(item) ? answerState(item) : null;
    item.questions.forEach((q, qi) => {
      node.appendChild(el("p", "meta", q.question));
      const list = el("ul", "opts");
      q.options.forEach((option, oi) => {
        const chosen = option === q.chosen;
        const picked = chosen || (state !== null && state.picks[qi] === oi);
        list.appendChild(el("li", picked ? "picked" : "", chosen ? "chosen: " + option : option));
      });
      node.appendChild(list);
    });
  } else if (item.items.length > 0) {
    const list = el("ul", "opts");
    for (const entry of item.items) list.appendChild(el("li", "", entry));
    node.appendChild(list);
  }
}
const UNDO_MS = 5000;
const answers = new Map();
let lastView = null;
let currentId = null;
function itemId(item) {
  return item.project_id + "#" + item.key;
}
function answerable(item) {
  return item.reason === "decision" && item.questions.length > 0 && !item.answered;
}
function startPicks(item) {
  return item.questions.map((q) => {
    const chosen = q.options.indexOf(q.chosen);
    if (chosen >= 0) return chosen;
    const recommended = q.options.indexOf(q.recommended);
    return recommended >= 0 ? recommended : null;
  });
}
function answerState(item) {
  const id = itemId(item);
  let state = answers.get(id);
  if (state === undefined) {
    const picks = startPicks(item);
    const first = picks.indexOf(null);
    state = {
      phase: "choosing", picks, q: first >= 0 ? first : 0, timer: null, reason: "",
      project_id: item.project_id, key: item.key,
    };
    answers.set(id, state);
  }
  return state;
}
function choosable(state) {
  return state.phase === "choosing" || state.phase === "failed";
}
function currentEntry(open) {
  for (const item of open) {
    if (!answerable(item)) continue;
    const state = answerState(item);
    if (choosable(state)) return { item, state };
  }
  return null;
}
function picksComplete(item, state) {
  return item.questions.every((_, i) => typeof state.picks[i] === "number");
}
function redraw() {
  if (lastView !== null) renderInbox(lastView);
}
function choose(state, qi, oi) {
  if (!choosable(state)) return;
  state.picks[qi] = oi;
  state.q = qi;
  state.phase = "choosing";
  state.reason = "";
}
function start(item, state) {
  if (!choosable(state) || !picksComplete(item, state)) return false;
  state.phase = "waiting";
  state.reason = "";
  state.timer = setTimeout(() => fireAnswer(itemId(item)), UNDO_MS);
  return true;
}
function undo(state) {
  if (state.phase !== "waiting") return;
  clearTimeout(state.timer);
  state.timer = null;
  state.phase = "choosing";
}
function fireAnswer(id) {
  const state = answers.get(id);
  if (state === undefined || state.phase !== "waiting") return;
  state.timer = null;
  const item = lastView === null ? undefined : lastView.inbox.open.find((i) => itemId(i) === id);
  if (item === undefined) {
    answers.delete(id);
    return;
  }
  sendAnswer(id, state, item);
}
async function sendAnswer(id, state, item) {
  state.phase = "sending";
  redraw();
  let reason = null;
  try {
    const response = await fetch("/api/answer", {
      method: "POST",
      headers: { "X-Console-Token": token, "Content-Type": "application/json" },
      body: JSON.stringify({
        project_id: state.project_id, key: state.key,
        choices: item.questions.map((_, i) => state.picks[i]),
      }),
    });
    if (response.status !== 204) {
      reason = (await response.text()).trim() || "HTTP " + response.status;
    }
  } catch (error) {
    console.error(error);
    reason = "the console did not answer";
  }
  if (answers.get(id) !== state) return;
  if (reason === null) {
    state.phase = "sent";
  } else {
    state.phase = "failed";
    state.reason = reason;
  }
  redraw();
}
function actionButton(cls, label, onClick) {
  const button = el("button", cls, label);
  button.type = "button";
  button.addEventListener("click", onClick);
  return button;
}
function actionLine(item, state) {
  const act = el("p", "act");
  if (state.phase === "waiting") {
    act.appendChild(el("span", "", "Sending in five seconds."));
    act.appendChild(actionButton("undo", "Undo", () => { undo(state); redraw(); }));
  } else if (state.phase === "sending") {
    act.appendChild(el("span", "", "Sending\u2026"));
  } else if (state.phase === "sent") {
    act.appendChild(el("span", "", "Answered, waiting for the agent to pick it up"));
  } else {
    if (state.phase === "failed") act.appendChild(el("span", "fail", "Could not send: " + state.reason));
    const send = actionButton("send", "Send", () => { if (start(item, state)) redraw(); });
    if (!picksComplete(item, state)) send.setAttribute("disabled", "");
    act.appendChild(send);
  }
  return act;
}
function answerBox(item, state) {
  const live = choosable(state);
  const now = Math.min(state.q, item.questions.length - 1);
  const box = el("div", "abox");
  item.questions.forEach((q, qi) => {
    box.appendChild(el("p", live && itemId(item) === currentId && qi === now ? "meta now" : "meta", q.question));
    const list = el("ul", "opts");
    q.options.forEach((option, oi) => {
      const button = el("button", state.picks[qi] === oi ? "opt picked" : "opt");
      button.type = "button";
      if (!live) button.setAttribute("disabled", "");
      button.appendChild(el("kbd", "", String(oi + 1)));
      button.appendChild(el("span", "", option === q.chosen ? "chosen: " + option : option));
      button.addEventListener("click", () => {
        if (!choosable(state)) return;
        choose(state, qi, oi);
        redraw();
      });
      const row = el("li");
      row.appendChild(button);
      list.appendChild(row);
    });
    box.appendChild(list);
  });
  box.appendChild(actionLine(item, state));
  return box;
}
function boxState(item) {
  if (!answerable(item)) return null;
  const state = answerState(item);
  return itemId(item) === currentId || state.phase !== "choosing" ? state : null;
}
function leadItem(item) {
  const card = el("article", "card");
  card.appendChild(el("h2", "", item.project_id + " #" + item.issue));
  card.appendChild(el("p", "ask", item.question));
  const state = boxState(item);
  if (state === null) appendDetail(card, item);
  else card.appendChild(answerBox(item, state));
  card.appendChild(el("p", "meta", metaLine(item)));
  const links = el("p", "meta");
  links.appendChild(answerLink(item));
  card.appendChild(links);
  return card;
}
function itemLine(item) {
  const line = el("li");
  line.appendChild(el("b", "", item.project_id + " #" + item.issue));
  line.appendChild(el("span", "", item.question));
  const state = boxState(item);
  if (state === null) appendDetail(line, item);
  else line.appendChild(answerBox(item, state));
  line.appendChild(el("span", "", metaLine(item)));
  line.appendChild(answerLink(item));
  return line;
}
function renderInbox(view) {
  const fresh = view !== lastView;
  lastView = view;
  const section = document.getElementById("inbox");
  section.replaceChildren();
  const open = view.inbox.open;
  const present = new Set(open.map(itemId));
  // A frame that shows a sent item open again supersedes the page's own "sent"; a redraw of the same view does not.
  const reopened = new Set(fresh ? open.filter(answerable).map(itemId) : []);
  for (const [id, state] of answers) {
    const gone = !present.has(id) && state.phase !== "waiting" && state.phase !== "sending";
    if (gone || (state.phase === "sent" && reopened.has(id))) answers.delete(id);
  }
  const current = currentEntry(open);
  currentId = current === null ? null : itemId(current.item);
  if (open.length > 0) section.appendChild(leadItem(open[0]));
  if (open.length > 1) {
    const rest = el("ul", "rest");
    for (const item of open.slice(1)) rest.appendChild(itemLine(item));
    section.appendChild(rest);
  }
  const answered = view.inbox.answered;
  if (answered.length > 0) {
    section.appendChild(el("h2", "done-head", "Answered, waiting for the agent to pick it up"));
    const done = el("ul", "done");
    for (const item of answered) done.appendChild(itemLine(item));
    section.appendChild(done);
  }
}
function momentLine(moment) {
  const line = el("li");
  line.appendChild(el("span", "at", when(moment.at)));
  line.appendChild(el("span", "", moment.sentence));
  return line;
}
function renderDigest(view) {
  const section = document.getElementById("digest");
  section.replaceChildren();
  const digest = view.digest;
  if (!digest) return;
  const heading = digest.first_visit ? "In the last eight hours" : "Since you last looked, " + when(digest.since);
  section.appendChild(el("h2", "digest-head", heading));
  if (digest.recent.length === 0 && digest.earlier.length === 0) {
    section.appendChild(el("p", "empty", "Nothing changed."));
    return;
  }
  const recent = el("ul", "digest");
  for (const moment of digest.recent) recent.appendChild(momentLine(moment));
  section.appendChild(recent);
  if (digest.earlier.length === 0) return;
  const fold = el("details", "earlier");
  fold.dataset.key = "earlier";
  const summary = el("summary");
  summary.appendChild(el("b", "", "Earlier"));
  summary.appendChild(el("span", "", String(digest.earlier.length + digest.omitted)));
  fold.appendChild(summary);
  const more = el("ul", "earlier-list");
  for (const moment of digest.earlier) more.appendChild(momentLine(moment));
  if (digest.omitted > 0) more.appendChild(el("li", "", "and " + digest.omitted + " more"));
  fold.appendChild(more);
  section.appendChild(fold);
}
function renderProjects(view) {
  const section = document.getElementById("projects");
  const heading = el("h2", "", "Projects ");
  heading.appendChild(el("span", "", String(view.project_count)));
  section.replaceChildren(heading);
  if (view.project_count === 0) {
    section.appendChild(el("p", "empty", "No project is registered yet."));
    return;
  }
  const list = el("ul");
  list.id = "list";
  const live = new Set();
  for (const entry of view.entries) {
    for (const project of entry.type === "quiet_group" ? entry.projects : [entry]) {
      for (const sprint of project.sprints || []) live.add(sprint.sprint_id);
    }
  }
  for (const id of [...withdrawals.keys()]) {
    if (!live.has(id)) withdrawals.delete(id);
  }
  for (const id of [...latestSprints.keys()]) {
    if (!live.has(id)) latestSprints.delete(id);
  }
  for (const entry of view.entries) {
    if (entry.type === "quiet_group") {
      const fold = el("details", "quietfold");
      fold.dataset.key = "quiet";
      const summary = el("summary");
      summary.appendChild(quietIcon());
      summary.appendChild(el("b", "", entry.label));
      fold.appendChild(summary);
      const inner = el("ul");
      for (const project of entry.projects) inner.appendChild(projectLine(project));
      fold.appendChild(inner);
      const item = el("li");
      item.appendChild(fold);
      list.appendChild(item);
    } else {
      list.appendChild(projectLine(entry));
    }
  }
  section.appendChild(list);
}
function renderUnmanaged(view) {
  const section = document.getElementById("unmanaged");
  section.replaceChildren();
  if (view.unmanaged.length === 0) return;
  const list = el("ul");
  for (const entry of view.unmanaged) {
    const line = el("li", "line");
    line.appendChild(el("b", "root", entry.root));
    line.appendChild(el("span", "", entry.label));
    if (entry.outside_sprints.sessions.length > 0) {
      line.appendChild(outsideFold(entry.outside_sprints, "outside:" + entry.root));
    }
    list.appendChild(line);
  }
  section.appendChild(list);
}
const MAX_GOAL = 2000;
const draft = { open: false, filter: "", text: "", project: null, phase: "idle", reason: "", rev: 0 };
let goalUi = null;
let recentProjects = [];
function goalMatches() {
  const needle = draft.filter.toLowerCase();
  return recentProjects.filter((id) => id.toLowerCase().includes(needle));
}
function chosenProject() {
  const matches = goalMatches();
  if (draft.project !== null && matches.includes(draft.project)) return draft.project;
  return matches.length > 0 ? matches[0] : null;
}
function refreshGoalList() {
  if (goalUi === null) return;
  const chosen = chosenProject();
  const items = goalMatches().map((id) => {
    const button = actionButton(id === chosen ? "goal-project picked" : "goal-project", id, () => {
      draft.project = id;
      draft.rev += 1;
      refreshGoalList();
    });
    const row = el("li");
    row.appendChild(button);
    return row;
  });
  goalUi.list.replaceChildren(...items);
}
function showGoalReason() {
  if (goalUi === null) return;
  goalUi.status.replaceChildren(
    ...(draft.reason === "" ? [] : [el("p", "fail", "Could not send: " + draft.reason)]),
  );
}
function closeGoal() {
  if (draft.phase !== "sending") draft.reason = "";
  draft.open = false;
  goalUi = null;
  renderGoal();
}
async function sendGoal() {
  if (draft.phase === "sending") return;
  const project = chosenProject();
  draft.reason = "";
  if (project === null) draft.reason = "choose a project";
  else if (Array.from(draft.text.trim()).length > MAX_GOAL) {
    draft.reason = "a goal is at most " + MAX_GOAL + " characters";
  }
  if (draft.reason !== "") {
    showGoalReason();
    return;
  }
  draft.phase = "sending";
  const sentRev = draft.rev;
  showGoalReason();
  if (goalUi !== null) goalUi.send.disabled = true;
  let reason = null;
  try {
    const response = await fetch("/api/goal", {
      method: "POST",
      headers: { "X-Console-Token": token, "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: project, goal: draft.text }),
    });
    if (response.status !== 204) {
      reason = (await response.text()).trim() || "HTTP " + response.status;
    }
  } catch (error) {
    console.error(error);
    reason = "the console did not answer";
  }
  draft.phase = "idle";
  if (goalUi !== null) goalUi.send.disabled = false;
  if (reason === null) {
    draft.reason = "";
    if (draft.rev === sentRev) {
      draft.filter = "";
      draft.text = "";
      draft.project = null;
      if (draft.open) closeGoal();
    } else showGoalReason();
  } else {
    draft.reason = reason;
    showGoalReason();
  }
}
function buildGoalBox(section) {
  const box = el("div", "goal-box");
  const filter = el("input", "goal-filter");
  filter.setAttribute("type", "text");
  filter.setAttribute("aria-label", "Filter projects");
  filter.setAttribute("placeholder", "Filter projects");
  filter.value = draft.filter;
  filter.addEventListener("input", (event) => {
    draft.filter = event.target.value;
    draft.rev += 1;
    refreshGoalList();
  });
  const list = el("ul", "goal-projects");
  const text = el("textarea", "goal-text");
  text.setAttribute("aria-label", "Goal");
  text.setAttribute("placeholder", "What should the next sprint achieve?");
  text.value = draft.text;
  text.addEventListener("input", (event) => {
    draft.text = event.target.value;
    draft.rev += 1;
  });
  const status = el("div", "goal-status");
  const send = actionButton("goal-send", "Send", sendGoal);
  const act = el("div", "goal-act");
  act.appendChild(send);
  act.appendChild(actionButton("goal-cancel", "Cancel", closeGoal));
  for (const part of [filter, list, text, status, act]) box.appendChild(part);
  section.replaceChildren(box);
  goalUi = { filter, list, text, status, send };
  send.disabled = draft.phase === "sending";
  refreshGoalList();
  showGoalReason();
}
function openGoal() {
  draft.open = true;
  if (goalUi === null) buildGoalBox(document.getElementById("goal"));
  goalUi.filter.focus();
}
const goalOpener = el("button", "goal-open", "State a goal");
goalOpener.setAttribute("type", "button");
goalOpener.setAttribute("aria-keyshortcuts", "g");
goalOpener.addEventListener("click", openGoal);
function renderGoal() {
  const section = document.getElementById("goal");
  if (draft.open) {
    if (goalUi === null) buildGoalBox(section);
    else refreshGoalList();
  } else if (section.children.length !== 1 || section.children[0] !== goalOpener) {
    section.replaceChildren(goalOpener);
  }
}
function render(view) {
  const wasOpen = new Set();
  for (const fold of document.querySelectorAll("details[open]")) wasOpen.add(fold.dataset.key);
  renderStatement(view);
  recentProjects = view.recent_projects || [];
  renderGoal();
  renderCapacity(view);
  renderPromoted(view);
  renderInbox(view);
  renderDigest(view);
  renderProjects(view);
  renderUnmanaged(view);
  for (const fold of document.querySelectorAll("details")) {
    if (wasOpen.has(fold.dataset.key)) fold.open = true;
  }
}
const token = document.getElementById("console-token").content;
const LOOK_MS = 5000;
let heldSince = document.hasFocus() ? Date.now() : null;
function endHold() {
  if (heldSince === null) return;
  const held = Date.now() - heldSince;
  heldSince = null;
  if (held > LOOK_MS) {
    fetch("/api/looked", { method: "POST", headers: { "X-Console-Token": token }, keepalive: true }).catch(() => {});
  }
}
window.addEventListener("focus", () => { if (heldSince === null) heldSince = Date.now(); });
window.addEventListener("blur", endHold);
window.addEventListener("pagehide", endHold);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") endHold(); });
document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.altKey || event.metaKey || event.repeat || lastView === null) return;
  if (event.key === "Escape") {
    let undone = false;
    for (const state of answers.values()) {
      if (state.phase === "waiting") {
        undo(state);
        undone = true;
      }
    }
    if (undone) {
      event.preventDefault();
      redraw();
    } else if (draft.open) {
      event.preventDefault();
      closeGoal();
    }
    return;
  }
  const focused = event.target && event.target.tagName;
  if (["A", "BUTTON", "SUMMARY", "INPUT", "TEXTAREA", "SELECT"].includes(focused)) return;
  if (event.key === "g") {
    openGoal();
    event.preventDefault();
    return;
  }
  const current = currentEntry(lastView.inbox.open);
  if (current === null) return;
  const { item, state } = current;
  if (event.key === "Enter") {
    if (start(item, state)) {
      event.preventDefault();
      redraw();
    }
  } else if (/^[1-9]$/.test(event.key)) {
    const qi = Math.min(state.q, item.questions.length - 1);
    const oi = Number(event.key) - 1;
    if (oi >= item.questions[qi].options.length) return;
    choose(state, qi, oi);
    state.q = Math.min(qi + 1, item.questions.length - 1);
    event.preventDefault();
    redraw();
  }
});
const conn = document.getElementById("conn");
const source = new EventSource("/api/stream");
source.addEventListener("view", (event) => render(JSON.parse(event.data)));
source.onopen = () => { conn.textContent = ""; };
source.onerror = () => { conn.textContent = "Reconnecting…"; };
</script>
