<style>

.card { padding: 0 0 18px; }

.card .meta { margin-top: 8px; font-size: .8125rem; color: var(--ov2); }

.brief-row > summary::-webkit-details-marker { display: none; }
.brief-row > summary:hover { background: rgba(202, 211, 245, .05); }
.brief-row > .card { margin-top: 6px; }
.done-item { flex: 1 0 100%; min-width: 0; }

.keys span { display: inline-flex; align-items: center; gap: 6px; }
.done-item summary, .check-more summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; cursor: pointer; list-style: none; padding: 4px 12px; margin: 0 -12px; border-radius: 10px; font-size: .875rem; color: var(--ov2); transition: background-color .16s; }
.done-item summary { flex-wrap: nowrap; }
.done-item summary > b { flex: 0 1000 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.done-item summary > span { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.done-item summary::-webkit-details-marker, .check-more summary::-webkit-details-marker { display: none; }
.done-item summary:hover, .check-more summary:hover { background: rgba(202, 211, 245, .05); }
.done-item > :not(summary) { margin-top: 4px; }
.check-more { margin-top: 6px; }
.abox { flex-basis: 100%; margin-top: 6px; }
.abox .meta { margin-top: 6px; }
.abox .meta.now { color: var(--text); }
.abox .opts { list-style: none; padding-left: 0; display: flex; flex-direction: column; align-items: stretch; gap: 2px; margin-top: 14px; }
.opt, .send, .undo, .approve, .reply-send, .goal-send, .goal-cancel, .goal-project, .give-goal, .withdraw, .retry, .stop, .stop-confirm, .stop-cancel, .try-again, .stall-withdraw, .continue, .progress-withdraw, .tell-open, .tell-send, .abox button[class^="ans-"] { display: inline-flex; align-items: baseline; gap: 8px; font: inherit; color: inherit; text-align: left; background: none; border: 1px solid var(--hair); border-radius: 8px; padding: 2px 10px; cursor: pointer; transition: background-color .16s; }
.opt:hover:enabled, .send:hover:enabled, .undo:hover:enabled, .approve:hover:enabled, .reply-send:hover:enabled, .goal-send:hover:enabled, .goal-cancel:hover:enabled, .goal-project:hover:enabled, .give-goal:hover:enabled, .withdraw:hover:enabled, .retry:hover:enabled, .stop:hover:enabled, .stop-confirm:hover:enabled, .stop-cancel:hover:enabled, .try-again:hover:enabled, .stall-withdraw:hover:enabled, .continue:hover:enabled, .progress-withdraw:hover:enabled, .tell-open:hover:enabled, .tell-send:hover:enabled, .abox button[class^="ans-"]:hover:enabled { background: rgba(202, 211, 245, .05); }
.opt:disabled, .send:disabled, .reply-send:disabled, .goal-send:disabled, .give-goal:disabled, .withdraw:disabled, .retry:disabled, .stop:disabled, .stop-confirm:disabled, .stop-cancel:disabled, .try-again:disabled, .stall-withdraw:disabled, .continue:disabled, .progress-withdraw:disabled, .tell-open:disabled, .tell-send:disabled, .abox button[class^="ans-"]:disabled { cursor: default; }

.abox textarea, .abox input { display: block; width: 100%; max-width: 40rem; margin-top: 6px; padding: 4px 8px; font: inherit; color: var(--text); background: var(--mantle); border: 1px solid var(--s1); border-radius: 8px; }

.goal-box { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 14rem); overflow-y: auto; padding: 12px; background: var(--base); border: 1px solid var(--lav); border-radius: 12px; box-shadow: 0 28px 48px -24px rgba(8, 9, 16, .9); }

}
// The control's elements are built once: no frame replaces an input, so a typed name or code keeps its focus and selection.
const accountState = { phase: "closed", adding: false, codeSending: false, cancelling: false, fetching: false, failure: "", shown: "" };
let accountCont = null;
const accountBox = document.getElementById("account-add");
const accountReason = el("span", "account-add-reason");
const accountOutcomeNote = el("p", "account-add-outcome");
const OUTCOME_WORDS = new Map([
  ["failed", (profile) => "The sign-in to " + profile + " did not finish."],
  ["timed_out", (profile) => "The sign-in to " + profile + " timed out."],
  ["cancelled", (profile) => "The sign-in to " + profile + " was cancelled."],
  ["signed_in", (profile) => profile + " is signed in."],
]);
const accountName = accountField("account-name", "Account name", "Account name");
const accountOpen = actionButton("account-add-open", "Add account", () => {
  accountOutcome = null;
  accountState.phase = "naming";
  accountState.failure = "";
  renderAccountAdd(lastView);
  accountName.focus();
});
const accountSend = actionButton("account-add-send", "Add", () => accountAddPost());
const accountCancel = actionButton("account-add-cancel", "Cancel", () => {
  accountName.value = "";
  accountState.phase = "closed";
  accountState.failure = "";
  renderAccountAdd(lastView);
});
accountName.addEventListener("input", () => {
  accountState.failure = "";
  renderAccountAdd(lastView);
});
async function accountAddPost() {
  const name = accountName.value.trim();
  if (accountState.adding || accountNameReason(name, lastView) !== null) return;
  accountState.adding = true;
  accountState.failure = "";
  renderAccountAdd(lastView);
  let reason = null;
  try {
    const response = await fetch("/api/account-add", { method: "POST", headers: stallHeaders(), body: JSON.stringify({ name }) });
    if (response.status === 200) {
      const answer = JSON.parse(await response.text());
      if (answer !== null && typeof answer === "object" && answer.profile === name
          && Number.isInteger(answer.attempt) && answer.attempt >= 1) {
        holdSigninLink(name, answer, true);
        accountSignin = name;
        accountAttempt = answer.attempt;
        accountConfirmed = false;
        accountOutcome = null;
        accountLink = isHttps(answer.link) ? answer.link : null;
        accountName.value = "";
        accountState.phase = "closed";
      } else {
        reason = "the console's answer was not understood";
      }
    } else {
      reason = (await response.text()).trim() || "HTTP " + response.status;
    }
  } catch (error) {
    console.error(error);
    reason = "the console did not answer";
  }
  accountState.adding = false;
  accountState.failure = reason === null ? "" : "Could not add the account: " + reason;
  // The add box is settled first: a card drawn before it would carry a code field while the continuation holds one too.
  renderAccountAdd(lastView);
  redraw();
}
async function accountSigninPost(flag, prefix, send, onOk, okStatus = 204) {
  const profile = accountSignin;
  if (profile === null || accountState[flag]) return;
  accountState[flag] = true;
  accountState.failure = "";
  renderAccountAdd(lastView);
  let reason = null;
  try {
    const response = await send(profile);
    if (response.status === okStatus) await onOk(response, profile);
    else reason = (await response.text()).trim() || "HTTP " + response.status;
  } catch (error) {
    console.error(error);
    reason = "the console did not answer";
  }
  accountState[flag] = false;
  if (accountSignin === profile) accountState.failure = reason === null ? "" : prefix + reason;
  renderAccountAdd(lastView);
}
function beginAccountSignin() {
  const code = accountField("account-code", "Sign-in code", "Code from the sign-in page");
  code.addEventListener("input", () => renderAccountAdd(lastView));
  const send = actionButton("account-code-send", "Send code", () => {
    const value = code.value.trim();
    if (value === "" || accountState.codeSending) return;
    accountSigninPost("codeSending", "Could not send the code: ", (profile) => fetch("/api/signin-code", {
      method: "POST", headers: stallHeaders(), body: JSON.stringify({ profile, code: value }),
    }), () => { code.value = ""; });
  });
  const cancel = actionButton("account-signin-cancel", "Cancel", () => {
    accountSigninPost("cancelling", "Could not cancel: ", (profile) => fetch("/api/signin-cancel", {
      method: "POST", headers: stallHeaders(), body: JSON.stringify({ profile }),
    }), () => {});
  });
  const fetchLink = actionButton("account-link-get", "Get sign-in link", () => {
    accountSigninPost("fetching", "Could not get the sign-in link: ", (profile) => fetch("/api/signin", {
      method: "POST", headers: stallHeaders(), body: JSON.stringify({ profile }),
    }), async (response, profile) => {
      const answer = JSON.parse(await response.text());
      // A continuation that ended meanwhile leaves the link to the profile's card.
      holdSigninLink(profile, answer, accountSignin === profile);
      if (accountSignin === profile && answer !== null && typeof answer === "object"
          && answer.attempt === accountAttempt && isHttps(answer.link)) accountLink = answer.link;
      redraw();
    }, 200);
  });
  accountCont = { note: el("p", "account-add-note", "Added " + accountSignin + ". Its sign-in has started."), link: null, code, send, cancel, fetchLink };
  accountState.phase = "closed";
  accountState.failure = "";
}
function endAccountSignin() {
  accountSignin = null;
  accountAttempt = null;
  accountConfirmed = false;
  accountLink = null;
  accountCont = null;
  accountState.codeSending = false;
  accountState.cancelling = false;
  accountState.fetching = false;
  accountState.failure = "";
}
// The continuation is settled from the view's run for the added profile alone, never from a held link or from whether its card shows.
function settleAccountSignin(view) {
  const runs = view !== null && view.signin_runs !== null && typeof view.signin_runs === "object" ? view.signin_runs : {};
  const run = runs[accountSignin];
  if (run !== null && typeof run === "object") {
    if (run.attempt === accountAttempt && run.state !== "running") {
      accountOutcome = { profile: accountSignin, state: run.state };
      endAccountSignin();
    } else if (run.attempt > accountAttempt) {
      endAccountSignin();
    } else if (run.attempt === accountAttempt) {
      accountConfirmed = true;
    }
  } else if (accountConfirmed) {
    endAccountSignin();
  }
}
// Updates the disabled states and the reason, and begins or ends the continuation; it never replaces an input or assigns lastView.
function renderAccountAdd(view) {
  if (accountSignin !== null) {
    settleAccountSignin(view);
    if (accountSignin !== null && accountCont === null) beginAccountSignin();
  }
  let want = accountState.phase;
  let reason = "";
  if (accountCont !== null) {
    const linked = accountLink !== null;
    want = linked ? "signin" : "signin-wait";
    reason = accountState.failure;
    if (linked && accountCont.link === null) accountCont.link = signinLinkNode("account-add-link", { link: accountLink });
    accountCont.fetchLink.disabled = accountState.fetching;
    accountCont.send.disabled = accountCont.code.value.trim() === "" || accountState.codeSending;
    accountCont.cancel.disabled = accountState.cancelling;
  } else if (want === "closed" && accountOutcome !== null && OUTCOME_WORDS.has(accountOutcome.state)) {
    want = "outcome";
    accountOutcomeNote.textContent = OUTCOME_WORDS.get(accountOutcome.state)(accountOutcome.profile);
  } else if (want === "naming") {
    const named = accountNameReason(accountName.value.trim(), view);
    accountSend.disabled = accountState.adding || named !== null;
    reason = accountState.adding ? "Adding\u2026" : named || accountState.failure;
  }
  if (accountState.shown !== want) {
    accountState.shown = want;
    const parts = want === "signin"
      ? [accountCont.note, accountCont.link, accountCont.code, accountCont.send, accountCont.cancel, accountReason]
      : want === "signin-wait" ? [accountCont.note, accountCont.fetchLink, accountCont.cancel, accountReason]
      : want === "outcome" ? [accountOutcomeNote, accountOpen]
      : want === "naming" ? [accountName, accountSend, accountCancel, accountReason] : [accountOpen];
    accountBox.replaceChildren(...parts);
  }
  if (accountReason.textContent !== reason) accountReason.textContent = reason;
}
renderAccountAdd(null);
let goalPanel = null;
function buildGoalBox() {
  const box = el("div", "goal-box");
  const filter = el("input", "goal-filter");
  filter.setAttribute("type", "text");
  filter.setAttribute("aria-label", "Filter projects");
  filter.setAttribute("placeholder", "Filter projects");
  filter.value = draft.filter;
  filter.addEventListener("input", (event) => {
    draft.filter = event.target.value;
    goalEdited();
    refreshGoalList();
  });
  const list = el("ul", "goal-projects");
  const status = el("div", "goal-status");
  const send = actionButton("goal-send", "Send", sendGoal);
  const act = el("div", "goal-act");
  act.appendChild(send);
  act.appendChild(actionButton("goal-cancel", "Cancel", closeGoal));
  for (const part of [filter, list, status, act]) box.appendChild(part);
  goalPanel = box;
  goalUi = { filter, list, status, send };
  send.disabled = draft.phase === "sending";
  refreshGoalList();
  showGoalReason();
  return box;
}
function openGoal() {
  draft.open = true;
  renderGoal();
  goalText.focus();
}
function openGoalFor(projectId) {
  draft.filter = "";
  draft.project = projectId;
  goalEdited();
  draft.open = true;
  renderGoal();
  goalUi.filter.value = "";
  refreshGoalList();
  goalText.focus();
}
function renderGoal() {
  const bar = document.getElementById("goal");
  bar.className = draft.open ? "goal-bar open" : "goal-bar";
  if (draft.open) {
    if (goalPanel === null) bar.appendChild(buildGoalBox());
    else refreshGoalList();
  } else if (goalPanel !== null) {
    goalPanel.remove();
    goalPanel = null;
    goalUi = null;
  }
}
function render(view) {
  const wasOpen = new Set();
  for (const fold of document.querySelectorAll("details[open]")) wasOpen.add(fold.dataset.key);
  renderStatement(view);
  recentProjects = view.recent_projects || [];
  renderGoal();
  renderCapacity(view);
  renderPromoted(view);
  renderAccountAdd(view);
  renderInbox(view);
  renderDigest(view);
  renderProjects(view);
  renderUnmanaged(view);
  for (const fold of document.querySelectorAll("details")) {
    if (wasOpen.has(fold.dataset.key)) fold.open = true;
  }
}
function tick() {
  for (const t of document.querySelectorAll("time")) t.textContent = timeWords(t.dataset.form, t.dataset.stamp);
  setTimeout(tick, TICK_MS);
}
setTimeout(tick, TICK_MS);
const token = document.getElementById("console-token").content;
const LOOK_MS = 5000;
let heldSince = document.hasFocus() ? Date.now() : null;
function endHold() {
  if (heldSince === null) return;
  const held = Date.now() - heldSince;
  heldSince = null;
  if (held > LOOK_MS) {
    fetch("/api/looked", { method: "POST", headers: { "X-Console-Token": token }, keepalive: true }).catch(() => {});
  }
}
window.addEventListener("focus", () => { if (heldSince === null) heldSince = Date.now(); });
window.addEventListener("blur", endHold);
window.addEventListener("pagehide", endHold);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") endHold(); });
document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.altKey || event.metaKey || event.repeat || lastView === null) return;
  if (event.key === "Escape") {
    let undone = false;
    for (const state of answers.values()) {
      if (state.phase === "waiting") {
        undo(state);
        undone = true;
      }
    }
    if (undone) {
      event.preventDefault();
      redraw();
    } else if (draft.open) {
      event.preventDefault();
      closeGoal();
    }
    return;
  }
  const focused = event.target && event.target.tagName;
  if (["A", "BUTTON", "SUMMARY", "INPUT", "TEXTAREA", "SELECT"].includes(focused)) return;
  if (event.target && event.target.isContentEditable === true) return;
  if (event.key === "g") {
    openGoal();
    event.preventDefault();
    return;
  }
  const current = currentEntry(lastView.inbox.open);
  if (current === null) return;
  const { item, state } = current;
  if (event.key === "Enter") {
    if (isBrief(item) ? startApproval(item, state) : start(item, state)) {
      event.preventDefault();
      redraw();
    }
  } else if (/^[1-9]$/.test(event.key)) {
    if (isBrief(item)) return;
    const qi = Math.min(state.q, item.questions.length - 1);
    const oi = Number(event.key) - 1;
    if (oi >= item.questions[qi].options.length) return;
    choose(state, qi, oi);
    state.q = Math.min(qi + 1, item.questions.length - 1);
    event.preventDefault();
    redraw();
  }
});
const conn = document.getElementById("conn");
const source = new EventSource("/api/stream");
source.addEventListener("view", (event) => render(JSON.parse(event.data)));
source.onopen = () => { conn.textContent = ""; };
source.onerror = () => { conn.textContent = "Reconnecting…"; };
</script>
