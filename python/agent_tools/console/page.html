<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="console-token" id="console-token" content="__CONSOLE_TOKEN__">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Console</title>
<style>
:root {
  --base: #24273a; --mantle: #1e2030;
  --s0: #363a4f; --s1: #494d64; --s2: #5b6078;
  --text: #cad3f5; --sub1: #b8c0e0; --sub0: #a5adcb; --ov2: #939ab7;
  --crust: #181926; --peach: #f5a97f; --lav: #b7bdf8;
  --green: #a6da95; --yellow: #eed49f; --red: #ed8796;
  --hair: rgba(202, 211, 245, .09);
  --ui: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter Variable", "Inter", system-ui, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Display", "Inter Variable", "Inter", system-ui, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--base); scrollbar-color: var(--s1) transparent; scrollbar-width: thin; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--base); color: var(--text);
  font: 400 .9375rem/1.5 var(--ui); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
h1, h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; border-radius: 6px; }
kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; font: 600 .71875rem/1 var(--ui); color: var(--sub0); border: 1px solid var(--s2); border-radius: 5px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; align-self: center; }
.ic .f { fill: currentColor; stroke: none; }

.top { position: sticky; top: 0; z-index: 10; background: var(--base); border-bottom: 1px solid var(--hair); }
.top-in { max-width: 1360px; margin: 0 auto; padding: 8px 48px; display: flex; align-items: center; gap: 28px; min-height: 56px; }
.brand { font-weight: 600; color: var(--sub1); white-space: nowrap; letter-spacing: -.005em; }
.conn { color: var(--ov2); font-size: .8125rem; }
.cap { display: flex; flex-wrap: wrap; gap: 2px 20px; margin-left: auto; font-size: .8125rem; color: var(--sub0); }
.cap-p { display: inline-flex; gap: 6px; }
.cap-p b { font-weight: 600; }
.cap-out { color: var(--red); }
.cap-tight { color: var(--yellow); }

.desk-grid { max-width: 1360px; margin: 0 auto; padding: 30px 48px 72px; display: grid; grid-template-columns: minmax(0, 1fr) 460px; column-gap: 88px; align-items: start; }

.statement h1 { font: 650 3.5rem/1.04 var(--display); letter-spacing: -.028em; text-wrap: balance; }
.statement .sub { margin-top: 16px; font-size: 1.125rem; line-height: 1.5; color: var(--sub1); max-width: 44rem; text-wrap: pretty; }
.statement h1.needs { color: var(--peach); }

#inbox { margin-top: 40px; max-width: 44rem; }
.card { padding: 0 0 18px; }
.card.lead { background: var(--s0); border: 1px solid var(--hair); border-radius: 16px; padding: 22px 32px 20px; margin: 0 -32px; box-shadow: 0 28px 48px -30px rgba(8, 9, 16, .9), 0 3px 8px -3px rgba(8, 9, 16, .45); }
.card .q { margin-top: 10px; font: 600 1.5rem/1.3 var(--display); letter-spacing: -.012em; text-wrap: balance; }
.more { font-size: .8125rem; color: var(--ov2); }
.card .more { display: block; margin-top: 4px; }
.card .opts { margin-top: 6px; padding-left: 18px; list-style: disc; color: var(--sub0); font-size: .84375rem; }
.rest .opts, .done .opts { flex-basis: 100%; margin: 0; padding-left: 18px; list-style: disc; color: var(--sub0); font-size: .84375rem; }
.rest .meta, .done .meta { flex-basis: 100%; margin: 0; font-size: .8125rem; color: var(--ov2); }
.card .opts .picked, .rest .opts .picked, .done .opts .picked { color: var(--lav); }
.card .meta { margin-top: 8px; font-size: .8125rem; color: var(--ov2); }
.card .head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 0; font-size: .84375rem; color: var(--sub0); }
.head .wait { margin-left: auto; }
.kind { display: inline-flex; gap: 7px; font-weight: 600; }
.kind.needs { color: var(--peach); }
.held { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hair); font-size: .84375rem; color: var(--sub0); }
.rest, .done { margin-top: 10px; }
.rest li, .done li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 5px 0; font-size: .875rem; color: var(--ov2); }
.rest b, .done b { font-weight: 600; color: var(--sub0); }
.rest > li.row { display: block; padding: 12px 0; }
.rest > li.row + li.row { border-top: 1px solid var(--hair); }
.row-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; width: 100%; margin: 0; }
.row-head b { font-size: 1rem; font-weight: 500; color: var(--text); }
.row-head .lm { font-size: .84375rem; color: var(--sub0); }
.row-head .lw { margin-left: auto; font-size: .84375rem; color: var(--sub0); white-space: nowrap; }
.done-item { flex: 1 0 100%; min-width: 0; }
.keys { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .8125rem; color: var(--ov2); }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.done-item summary, .check-more summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; cursor: pointer; list-style: none; padding: 4px 12px; margin: 0 -12px; border-radius: 10px; font-size: .875rem; color: var(--ov2); transition: background-color .16s; }
.done-item summary { flex-wrap: nowrap; }
.done-item summary > b { flex: 0 1000 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.done-item summary > span { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.done-item summary::-webkit-details-marker, .check-more summary::-webkit-details-marker { display: none; }
.done-item summary:hover, .check-more summary:hover { background: rgba(202, 211, 245, .05); }
.done-item > :not(summary) { margin-top: 4px; }
.check-more { margin-top: 6px; }
.abox { flex-basis: 100%; margin-top: 6px; }
.abox .meta { margin-top: 6px; }
.abox .meta.now { color: var(--text); }
.abox .opts { list-style: none; padding-left: 0; display: flex; flex-direction: column; align-items: stretch; gap: 2px; margin-top: 14px; }
.opt, .send, .undo, .approve, .reply-send, .goal-open, .goal-send, .goal-cancel, .goal-project, .give-goal, .withdraw, .retry, .tell-send, .abox button[class^="ans-"] { display: inline-flex; align-items: baseline; gap: 8px; font: inherit; color: inherit; text-align: left; background: none; border: 1px solid var(--hair); border-radius: 8px; padding: 2px 10px; cursor: pointer; transition: background-color .16s; }
.opt:hover:enabled, .send:hover:enabled, .undo:hover:enabled, .approve:hover:enabled, .reply-send:hover:enabled, .goal-open:hover:enabled, .goal-send:hover:enabled, .goal-cancel:hover:enabled, .goal-project:hover:enabled, .give-goal:hover:enabled, .withdraw:hover:enabled, .retry:hover:enabled, .tell-send:hover:enabled, .abox button[class^="ans-"]:hover:enabled { background: rgba(202, 211, 245, .05); }
.opt:disabled, .send:disabled, .reply-send:disabled, .goal-send:disabled, .give-goal:disabled, .withdraw:disabled, .retry:disabled, .tell-send:disabled, .abox button[class^="ans-"]:disabled { cursor: default; }
.abox button[class^="ans-"]:disabled { color: var(--ov2); }
.abox .detail { margin-top: 6px; padding: 6px 10px; max-height: 24rem; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: .84375rem; color: var(--sub0); background: var(--mantle); border: 1px solid var(--hair); border-radius: 8px; }
.card .detail, .rest .detail, .done .detail { flex-basis: 100%; margin: 6px 0 0; padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: .84375rem; color: var(--sub0); background: var(--mantle); border: 1px solid var(--hair); border-radius: 8px; }
.abox textarea, .abox input { display: block; width: 100%; max-width: 40rem; margin-top: 6px; padding: 4px 8px; font: inherit; color: var(--text); background: var(--mantle); border: 1px solid var(--s1); border-radius: 8px; }
.abox textarea { min-height: 4.5rem; resize: vertical; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; column-gap: 14px; width: 100%; padding: 9px 14px; border-radius: 10px; border: 1px solid transparent; }
.opt .ot { font-size: 1.0625rem; line-height: 1.4; font-weight: 500; overflow-wrap: anywhere; }
.opt kbd { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1px solid var(--s2); border-radius: 6px; font: inherit; font-size: .75rem; font-weight: 600; color: var(--sub1); }
.opt .rec { font-size: .75rem; font-weight: 600; color: var(--sub1); border: 1px solid var(--s2); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.opt.picked { border-color: var(--lav); background: rgba(183, 189, 248, .10); }
.opt.picked kbd { background: var(--lav); border-color: var(--lav); color: var(--crust); }
.goal-project.picked { color: var(--lav); border-color: var(--lav); }
#goal { margin-top: 24px; max-width: 44rem; }
.goal-box { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.goal-filter, .goal-text, .reply-text { width: 100%; font: inherit; color: var(--text); background: var(--mantle); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 10px; }
.goal-text, .reply-text { min-height: 6em; resize: vertical; }
.brief .goal-line { margin-top: 6px; font-size: 1.0625rem; overflow-wrap: anywhere; }
.brief .parts p { margin-top: 10px; }
.brief .parts ul { margin-top: 4px; padding-left: 18px; list-style: disc; color: var(--sub0); font-size: .84375rem; }
.reply { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 12px; }
.goal-projects { display: flex; flex-wrap: wrap; gap: 4px; }
.goal-status:empty { display: none; }
.goal-act { display: flex; gap: 8px; }
.sprints { flex: 1 0 100%; padding: 0 0 0 16px; }
.sprint { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: .8125rem; color: var(--sub0); }
.sprint .goal-line { color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
.sprint .age, .sprint .manager, .sprint .until, .sprint .status-age { color: var(--ov2); }
.sp-head { flex: 1 0 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) fit-content(40%); column-gap: 12px; row-gap: 2px; align-items: start; }
.sp-status { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 0 8px; }
.sp-prog { display: flex; align-items: flex-start; justify-content: flex-end; gap: 8px; min-width: 0; font-size: .8125rem; color: var(--sub0); }
.pips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; padding-top: 3px; }
.pip-count { flex: none; white-space: nowrap; }
.pip { display: block; width: 9px; height: 9px; border-radius: 2px; flex: none; }
.pip.pip-landed { background: var(--sub0); }
.pip.pip-delivery { border: 1.5px solid var(--green); background: var(--green); box-shadow: inset 0 0 0 1.5px var(--base); }
.pip.pip-queued { border: 1.5px solid var(--s2); }
.pip.pip-held { background: linear-gradient(90deg, var(--yellow) 0 3.5px, transparent 3.5px 5.5px, var(--yellow) 5.5px 9px); border-radius: 1.5px; }
.sprint-state { font-weight: 600; }
.st-go { color: var(--green); }
.st-wait { color: var(--yellow); }
.st-dim { color: var(--ov2); }
.sprint-state.needs, .sic.needs { color: var(--peach); }
.sic { display: flex; align-self: start; padding-top: 2px; }
.sprint-detail { flex: 1 0 100%; font-size: .8125rem; }
.sprint-detail summary { cursor: pointer; color: var(--ov2); }
.sprint-detail ul { margin-top: 2px; padding: 0 0 0 16px; }
.sprint-detail li { display: flex; flex-wrap: wrap; gap: 0 10px; color: var(--sub0); }
.sprint-detail p { color: var(--sub0); }
.sprint-detail .tracker { color: var(--lav); text-underline-offset: 3px; }
.sprint-sessions { flex: 1 0 100%; list-style: none; padding: 0 0 0 16px; }
.sprint-session { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.sprint-messages { flex: 1 0 100%; list-style: none; padding: 0 0 0 16px; }
.sprint-messages li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; color: var(--sub0); }
.message-state, .message-reply { color: var(--ov2); }
.message-reply { flex: 1 0 100%; padding-left: 16px; color: var(--sub0); overflow-wrap: anywhere; }
.unreachable { color: var(--ov2); }
.sprint-tell { flex: 1 0 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.sprint-tell label { color: var(--ov2); }
.tell { width: 100%; max-width: 40rem; min-height: 3.5rem; resize: vertical; font: inherit; color: var(--text); background: var(--mantle); border: 1px solid var(--hair); border-radius: 8px; padding: 4px 8px; }
.act { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 8px; font-size: .8125rem; color: var(--ov2); }
.fail { color: var(--red); }
.lead .act { margin-top: 14px; align-items: center; gap: 8px; font-size: .9375rem; }
.act .primary.needs { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; font-weight: 600; background: var(--peach); color: var(--crust); text-decoration: none; }
.act .primary.needs:hover:enabled { background: #f8bb98; }
.act .primary.needs:disabled { background: var(--s1); color: var(--sub0); cursor: not-allowed; }
.act .primary.needs kbd { border-color: rgba(24, 25, 38, .28); color: var(--crust); }
.item-detail { margin-left: auto; }
.item-detail summary { cursor: pointer; list-style: none; padding: 4px 12px; border-radius: 8px; color: var(--sub1); }
.item-detail summary::-webkit-details-marker { display: none; }
#digest { margin-top: 40px; max-width: 44rem; }
#digest:empty { margin-top: 0; }
.digest-head { font: 600 .875rem/1.4 var(--ui); color: var(--ov2); }
.digest, .earlier-list { margin-top: 6px; }
.digest li, .earlier-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 5px 0; font-size: .875rem; color: var(--sub0); }
.digest .at { color: var(--ov2); }
.earlier { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); }
.earlier summary { display: flex; align-items: baseline; gap: 8px; cursor: pointer; list-style: none; padding: 4px 12px; margin: 0 -12px; border-radius: 10px; font-size: .875rem; color: var(--ov2); transition: background-color .16s; }
.earlier summary::-webkit-details-marker { display: none; }
.earlier summary:hover { background: rgba(202, 211, 245, .05); }
.earlier summary b { font-weight: 600; color: var(--sub0); }
.answer { color: var(--lav); text-underline-offset: 3px; }
.side { margin-top: 12px; }
.side h2 { font: 600 .9375rem/1.4 var(--ui); display: flex; align-items: baseline; gap: 10px; }
.side h2 span { font-weight: 400; font-size: .8125rem; color: var(--ov2); }
.empty { margin-top: 12px; color: var(--sub0); font-size: .84375rem; }
#list { margin-top: 12px; }
.line { padding: 5px 0; font-size: .875rem; color: var(--ov2); }
.line b { font-weight: 600; color: var(--sub0); }
.pname { margin: 0; font-size: .9375rem; line-height: 1.4; font-weight: 600; color: var(--text); }
#list > li.line + li.line { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); }
.line summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; cursor: pointer; list-style: none; padding: 4px 12px; margin: 0 -12px; border-radius: 10px; transition: background-color .16s; }
.line summary::-webkit-details-marker { display: none; }
.line summary:hover { background: rgba(202, 211, 245, .05); }
.line summary > .sess-sum, .line summary > .run-sum { flex-basis: 100%; }
.line.quiet { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.line.quiet > details { flex: 1 1 auto; min-width: 0; }
.give-goal { margin-left: auto; font-size: .8125rem; color: var(--sub1); }
.run-sum { font-size: .8125rem; color: var(--sub0); }
.line .root { display: block; margin-top: 4px; font-size: .8125rem; color: var(--ov2); overflow-wrap: anywhere; }
.line .qw { display: inline-flex; align-items: baseline; gap: 6px; }
.quietfold { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--hair); }
.quietfold summary { display: flex; align-items: baseline; gap: 8px; cursor: pointer; list-style: none; padding: 4px 12px; margin: 0 -12px; border-radius: 10px; font-size: .875rem; color: var(--ov2); transition: background-color .16s; }
.quietfold summary::-webkit-details-marker { display: none; }
.quietfold summary:hover { background: rgba(202, 211, 245, .05); }
.quietfold summary b { font-weight: 600; color: var(--sub0); }
.quietfold ul { margin-top: 4px; padding: 0 0 0 22px; }
.line .untouched { font-size: .8125rem; }
.outside { font-size: .8125rem; margin-top: 4px; }
.outside h3 { font-size: .8125rem; font-weight: 600; color: var(--sub0); }
.outside ul { margin-top: 2px; padding: 0 0 0 16px; }
.outside li { display: flex; flex-wrap: wrap; gap: 0 10px; color: var(--sub0); }
.outside .runs { flex: 1 0 100%; margin-top: 0; padding: 0 0 0 16px; }
.run { display: flex; flex-wrap: wrap; gap: 0 10px; }
.run .stage { color: var(--sub0); }
.run .moved { color: var(--ov2); }
.cap-none { color: var(--ov2); }
.s-working { color: var(--green); }
.s-waiting_answer, .s-waiting_permission { color: var(--yellow); }
.s-limit { color: var(--red); }
.s-idle { color: var(--ov2); }
#unmanaged { margin-top: 24px; }

@media (max-width: 1180px) {
  .desk-grid { grid-template-columns: minmax(0, 1fr) 400px; column-gap: 56px; }
}
@media (max-width: 900px) {
  .card.lead { margin: 0 -8px; padding: 20px 16px; }
  .desk-grid { grid-template-columns: minmax(0, 1fr); padding: 32px 16px 56px; }
  .top-in { padding: 10px 16px; gap: 10px 16px; }
  .side { margin-top: 48px; }
  .statement h1 { font-size: 2.375rem; letter-spacing: -.022em; }
  .statement .sub { font-size: 1rem; }
}
@media (max-width: 480px) {
  .desk-grid { padding: 24px 16px 48px; }
  .statement h1 { font-size: 2rem; }
  .top-in { flex-wrap: wrap; }
  .cap { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="brand">Console</span><span class="cap" id="capacity"></span><span class="conn" id="conn" role="status">Reconnecting…</span></div></header>
<div class="desk-grid">
<main>
<div class="statement" id="statement"></div>
<section id="goal" aria-label="Goal"></section>
<section id="promoted" aria-label="Capacity"></section>
<section id="inbox" aria-label="Inbox"></section>
<section id="digest" aria-label="Since you last looked"></section>
</main>
<aside class="side" aria-label="Projects">
<section id="projects"></section>
<section id="unmanaged"></section>
</aside>
</div>
<template id="quiet-icon"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 9.5A5 5 0 0 1 6.5 3.5a5 5 0 1 0 6 6z"/></svg></template>
<template id="decision-icon"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5V9.5M8 9.5c0-3-3.6-2.6-3.6-6M8 9.5c0-3 3.6-2.6 3.6-6"/></svg></template>
<template id="brief-icon"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h5.2L12 5.3v8.2H4zM9 2.5v3h3M6.2 8.5h3.6M6.2 11h3.6"/></svg></template>
<template id="check-icon"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M5.4 8.2l1.8 1.8 3.4-3.7"/></svg></template>
<template id="approval-icon"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.4" cy="10.6" r="2.6"/><path d="M7.3 8.7L13 3M10.4 5.6l1.9 1.9"/></svg></template>
<template id="conflict-icon"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3.5l7 9M11.5 3.5l-7 9"/></svg></template>
<template id="play-icon"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path class="f" d="M5 3.2v9.6a.6.6 0 0 0 .9.5l7.4-4.8a.6.6 0 0 0 0-1L5.9 2.7a.6.6 0 0 0-.9.5z"/></svg></template>
<template id="pause-icon"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect class="f" x="3.5" y="3" width="3.2" height="10" rx="1"/><rect class="f" x="9.3" y="3" width="3.2" height="10" rx="1"/></svg></template>

async function tell(item, entry, sprint) {

  const text = draft === undefined ? "" : draft.value;

  fillSprint(item, entry, sprint);
  let reason = null;
  try {
    const response = await fetch("/api/message", {
      method: "POST",
      headers: { "X-Console-Token": token, "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: entry.project_id, sprint_id: id, text }),
    });
    if (response.status !== 204) {
      reason = (await response.text()).trim() || "HTTP " + response.status;
    }
  } catch (error) {
    console.error(error);
    reason = "the console did not answer";
  }
  if (tells.get(id) !== state) return;
  if (reason === null) {
    tells.delete(id);
    const typed = tellDrafts.get(id);
    if (typed !== undefined && typed.value === text) tellDrafts.delete(id);
  } else {
    state.phase = "failed";
    state.reason = reason;

  }
}

const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function pad(n) {

function ago(stamp) {

  if (ms < 60000) return "just now";
  if (ms < 3600000) return Math.floor(ms / 60000) + " min ago";
  if (ms < 86400000) return Math.floor(ms / 3600000) + " h ago";

}
function since(stamp) {
  const ms = Date.now() - Date.parse(stamp);

}

    if (picksComplete(current.item, current.state)) entry([el("kbd", "", "Enter")], " send answer");
  }
  if (open.some((item) => { const s = answers.get(stateId(item)); return s !== undefined && s.phase === "waiting"; })) {
    entry([el("kbd", "", "Esc")], " undo");
  }
  if (entries.length === 0) return null;
  const strip = el("p", "keys");
  for (const e of entries) strip.appendChild(e);
  return strip;
}
function renderInbox(view) {
  const fresh = view !== lastView;
  lastView = view;
  const section = document.getElementById("inbox");
  const active = document.activeElement;
  const held = active && active.dataset && active.dataset.draft !== undefined
    ? { key: active.dataset.draft, start: active.selectionStart, end: active.selectionEnd }
    : null;
  fields = new Map();
  const wasOpen = new Set();
  for (const fold of document.querySelectorAll("#inbox details[open]")) wasOpen.add(fold.dataset.key);
  const open = view.inbox.open;
  const briefs = open.filter(isBrief);
  const tracked = open.filter((item) => !isBrief(item));
  const present = new Set(open.map(stateId));
  // A frame that shows a sent item open again supersedes the page's own "sent"; a redraw of the same view does not.
  const reopened = new Set(fresh ? tracked.filter(answerable).map(itemId) : []);
  for (const [id, state] of answers) {
    if (state.kind === "brief") {
      if (!present.has(id)) dropBriefState(id, state, briefs);
      continue;
    }
    const gone = !present.has(id) && state.phase !== "waiting" && state.phase !== "sending";
    if (gone || (state.phase === "sent" && reopened.has(id))) answers.delete(id);
  }
  for (const id of [...replaced.keys()]) {
    if (!briefs.some((b) => b.sprint_id === id)) replaced.delete(id);
  }
  for (const key of Array.from(drafts.keys())) {
    const id = key.split("\n")[0];
    const state = answers.get(id);
    const busy = state !== undefined && (state.phase === "waiting" || state.phase === "sending");
    if (!present.has(id) && !busy) drafts.delete(key);
  }
  const current = currentEntry(open);
  currentId = current === null ? null : itemId(current.item);
  placeBriefCards(section, briefs);
  if (briefs.length === 0 && tracked.length > 0) section.appendChild(leadItem(tracked[0]));
  const rows = briefs.length === 0 ? tracked.slice(1) : tracked;
  if (rows.length > 0) {
    const rest = el("ul", "rest");
    for (const item of rows) rest.appendChild(itemLine(item));
    section.appendChild(rest);
  }
  const answered = view.inbox.answered;
  if (answered.length > 0) {
    const done = el("ul", "done");
    for (const item of answered) done.appendChild(answeredLine(item));
    section.appendChild(done);
  }
  const strip = keyStrip(current, open);
  if (strip !== null) section.appendChild(strip);
  for (const fold of document.querySelectorAll("#inbox details")) {
    if (wasOpen.has(fold.dataset.key)) fold.open = true;
  }
  const again = held === null ? undefined : fields.get(held.key);
  if (again !== undefined) {
    again.focus();
    again.setSelectionRange(held.start, held.end);
  }
}
function momentLine(moment) {
  const line = el("li");
  line.appendChild(timeEl("ago", moment.at, "at"));
  line.appendChild(el("span", "", moment.sentence));
  return line;
}
function renderDigest(view) {
  const section = document.getElementById("digest");
  section.replaceChildren();
  const digest = view.digest;
  if (!digest) return;
  section.appendChild(digest.first_visit
    ? el("h2", "digest-head", "In the last eight hours")
    : phrase("h2", "digest-head", "Since you last looked, ", timeEl("ago", digest.since, "")));
  if (digest.recent.length === 0 && digest.earlier.length === 0) {
    section.appendChild(el("p", "empty", "Nothing changed."));
    return;
  }
  const recent = el("ul", "digest");
  for (const moment of digest.recent) recent.appendChild(momentLine(moment));
  section.appendChild(recent);
  if (digest.earlier.length === 0) return;
  const fold = el("details", "earlier");
  fold.dataset.key = "earlier";
  const summary = el("summary");
  summary.appendChild(el("b", "", "Earlier"));
  summary.appendChild(el("span", "", String(digest.earlier.length + digest.omitted)));
  fold.appendChild(summary);
  const more = el("ul", "earlier-list");
  for (const moment of digest.earlier) more.appendChild(momentLine(moment));
  if (digest.omitted > 0) more.appendChild(el("li", "", "and " + digest.omitted + " more"));
  fold.appendChild(more);
  section.appendChild(fold);
}
function workCount(view) {
  let sprints = 0;
  let projects = 0;
  for (const entry of view.entries) {
    for (const one of entry.type === "quiet_group" ? entry.projects : [entry]) {
      const n = one.sprints ? one.sprints.length : 0;
      sprints += n;
      if (n > 0) projects += 1;
    }
  }
  if (sprints === 0) return "";
  return sprints + (sprints === 1 ? " sprint" : " sprints") + " across " + projects
    + (projects === 1 ? " project" : " projects");
}
function renderProjects(view) {
  const section = document.getElementById("projects");
  const heading = el("h2", "", "Work");
  const worked = workCount(view);
  if (worked !== "") heading.appendChild(el("span", "", worked));
  const active = document.activeElement;
  const heldTell = active && active.tagName === "TEXTAREA" && active.dataset
    && active.dataset.tell !== undefined
    ? { id: active.dataset.tell, start: active.selectionStart, end: active.selectionEnd }
    : null;
  section.replaceChildren(heading);
  if (view.project_count === 0) {
    section.appendChild(el("p", "empty", "No project is registered yet."));
    return;
  }
  const list = el("ul");
  list.id = "list";
  const live = new Set();
  const retryable = new Set();
  for (const entry of view.entries) {
    for (const project of entry.type === "quiet_group" ? entry.projects : [entry]) {
      for (const sprint of project.sprints || []) {
        live.add(sprint.sprint_id);
        if (sprint.retry === true) retryable.add(sprint.sprint_id);
      }
    }
  }
  for (const id of [...retries.keys()]) {
    if (!retryable.has(id)) retries.delete(id);
  }
  for (const id of [...withdrawals.keys()]) {
    if (!live.has(id)) withdrawals.delete(id);
  }
  for (const id of [...latestSprints.keys()]) {
    if (!live.has(id)) latestSprints.delete(id);
  }
  for (const id of [...tells.keys()]) {
    if (!live.has(id)) tells.delete(id);
  }
  for (const id of [...tellDrafts.keys()]) {
    if (!live.has(id)) tellDrafts.delete(id);
  }
  for (const entry of view.entries) {
    if (entry.type === "quiet_group") {
      const fold = el("details", "quietfold");
      fold.dataset.key = "quiet";
      const summary = el("summary");
      summary.appendChild(quietIcon());
      summary.appendChild(el("b", "", entry.label));
      fold.appendChild(summary);
      const inner = el("ul");
      for (const project of entry.projects) inner.appendChild(projectLine(project));
      fold.appendChild(inner);
      const item = el("li");
      item.appendChild(fold);
      list.appendChild(item);
    } else {
      list.appendChild(projectLine(entry));
    }
  }
  section.appendChild(list);
  if (heldTell !== null) {
    const again = Array.from(document.querySelectorAll("textarea.tell"))
      .find((area) => area.dataset.tell === heldTell.id);
    if (again !== undefined) {
      again.focus();
      again.setSelectionRange(heldTell.start, heldTell.end);
    }
  }
}
function renderUnmanaged(view) {
  const section = document.getElementById("unmanaged");
  section.replaceChildren();
  if (view.unmanaged.length === 0) return;
  const list = el("ul");
  for (const entry of view.unmanaged) {
    const line = el("li", "line");
    line.appendChild(lineFold("line:" + entry.root, el("h3", "pname", entry.name),
                              [el("span", "", entry.label)], entry.outside_sprints, entry.root));
    list.appendChild(line);
  }
  section.appendChild(list);
}
const MAX_GOAL = 2000;
const draft = { open: false, filter: "", text: "", project: null, phase: "idle", reason: "", rev: 0 };
let goalUi = null;
let recentProjects = [];
function goalMatches() {
  const needle = draft.filter.toLowerCase();
  return recentProjects.filter((id) => id.toLowerCase().includes(needle));
}
function chosenProject() {
  const matches = goalMatches();
  if (draft.project !== null && matches.includes(draft.project)) return draft.project;
  return matches.length > 0 ? matches[0] : null;
}
function refreshGoalList() {
  if (goalUi === null) return;
  const chosen = chosenProject();
  const items = goalMatches().map((id) => {
    const button = actionButton(id === chosen ? "goal-project picked" : "goal-project", id, () => {
      draft.project = id;
      goalEdited();
      refreshGoalList();
    });
    const row = el("li");
    row.appendChild(button);
    return row;
  });
  goalUi.list.replaceChildren(...items);
}
function showGoalReason() {
  if (goalUi === null) return;
  goalUi.status.replaceChildren(
    ...(draft.reason === "" ? [] : [el("p", "fail", "Could not send: " + draft.reason)]),
  );
}
function goalEdited() {
  draft.rev += 1;
  if (draft.reason === "") return;
  draft.reason = "";
  showGoalReason();
}
function closeGoal() {
  if (draft.phase !== "sending") draft.reason = "";
  draft.open = false;
  goalUi = null;
  renderGoal();
}
async function sendGoal() {
  if (draft.phase === "sending") return;
  const project = chosenProject();
  draft.reason = "";
  if (project === null) draft.reason = "choose a project";
  else if (Array.from(draft.text.trim()).length > MAX_GOAL) {
    draft.reason = "a goal is at most " + MAX_GOAL + " characters";
  }
  if (draft.reason !== "") {
    showGoalReason();
    return;
  }
  draft.phase = "sending";
  const sentRev = draft.rev;
  showGoalReason();
  if (goalUi !== null) goalUi.send.disabled = true;
  let reason = null;
  try {
    const response = await fetch("/api/goal", {
      method: "POST",
      headers: { "X-Console-Token": token, "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: project, goal: draft.text }),
    });
    if (response.status !== 204) {
      reason = (await response.text()).trim() || "HTTP " + response.status;
    }
  } catch (error) {
    console.error(error);
    reason = "the console did not answer";
  }
  draft.phase = "idle";
  if (goalUi !== null) goalUi.send.disabled = false;
  if (reason === null) {
    draft.reason = "";
    if (draft.rev === sentRev) {
      draft.filter = "";
      draft.text = "";
      draft.project = null;
      if (draft.open) closeGoal();
    } else showGoalReason();
  } else {
    draft.reason = reason;
    showGoalReason();
  }
}
function buildGoalBox(section) {
  const box = el("div", "goal-box");
  const filter = el("input", "goal-filter");
  filter.setAttribute("type", "text");
  filter.setAttribute("aria-label", "Filter projects");
  filter.setAttribute("placeholder", "Filter projects");
  filter.value = draft.filter;
  filter.addEventListener("input", (event) => {
    draft.filter = event.target.value;
    goalEdited();
    refreshGoalList();
  });
  const list = el("ul", "goal-projects");
  const text = el("textarea", "goal-text");
  text.setAttribute("aria-label", "Goal");
  text.setAttribute("placeholder", "What should the next sprint achieve?");
  text.value = draft.text;
  text.addEventListener("input", (event) => {
    draft.text = event.target.value;
    goalEdited();
  });
  const status = el("div", "goal-status");
  const send = actionButton("goal-send", "Send", sendGoal);
  const act = el("div", "goal-act");
  act.appendChild(send);
  act.appendChild(actionButton("goal-cancel", "Cancel", closeGoal));
  for (const part of [filter, list, text, status, act]) box.appendChild(part);
  section.replaceChildren(box);
  goalUi = { filter, list, text, status, send };
  send.disabled = draft.phase === "sending";
  refreshGoalList();
  showGoalReason();
}
function openGoal() {
  draft.open = true;
  if (goalUi === null) buildGoalBox(document.getElementById("goal"));
  goalUi.filter.focus();
}
function openGoalFor(projectId) {
  draft.filter = "";
  draft.project = projectId;
  goalEdited();
  draft.open = true;
  if (goalUi === null) buildGoalBox(document.getElementById("goal"));
  else {
    goalUi.filter.value = "";
    refreshGoalList();
  }
  goalUi.text.focus();
}
const goalOpener = el("button", "goal-open", "State a goal");
goalOpener.setAttribute("type", "button");
goalOpener.setAttribute("aria-keyshortcuts", "g");
goalOpener.addEventListener("click", openGoal);
function renderGoal() {
  const section = document.getElementById("goal");
  if (draft.open) {
    if (goalUi === null) buildGoalBox(section);
    else refreshGoalList();
  } else if (section.children.length !== 1 || section.children[0] !== goalOpener) {
    section.replaceChildren(goalOpener);
  }
}
function render(view) {
  const wasOpen = new Set();
  for (const fold of document.querySelectorAll("details[open]")) wasOpen.add(fold.dataset.key);
  renderStatement(view);
  recentProjects = view.recent_projects || [];
  renderGoal();
  renderCapacity(view);
  renderPromoted(view);
  renderInbox(view);
  renderDigest(view);
  renderProjects(view);
  renderUnmanaged(view);
  for (const fold of document.querySelectorAll("details")) {
    if (wasOpen.has(fold.dataset.key)) fold.open = true;
  }
}
function tick() {
  for (const t of document.querySelectorAll("time")) t.textContent = timeWords(t.dataset.form, t.dataset.stamp);
  setTimeout(tick, TICK_MS);
}
setTimeout(tick, TICK_MS);
const token = document.getElementById("console-token").content;
const LOOK_MS = 5000;
let heldSince = document.hasFocus() ? Date.now() : null;
function endHold() {
  if (heldSince === null) return;
  const held = Date.now() - heldSince;
  heldSince = null;
  if (held > LOOK_MS) {
    fetch("/api/looked", { method: "POST", headers: { "X-Console-Token": token }, keepalive: true }).catch(() => {});
  }
}
window.addEventListener("focus", () => { if (heldSince === null) heldSince = Date.now(); });
window.addEventListener("blur", endHold);
window.addEventListener("pagehide", endHold);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") endHold(); });
document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.altKey || event.metaKey || event.repeat || lastView === null) return;
  if (event.key === "Escape") {
    let undone = false;
    for (const state of answers.values()) {
      if (state.phase === "waiting") {
        undo(state);
        undone = true;
      }
    }
    if (undone) {
      event.preventDefault();
      redraw();
    } else if (draft.open) {
      event.preventDefault();
      closeGoal();
    }
    return;
  }
  const focused = event.target && event.target.tagName;
  if (["A", "BUTTON", "SUMMARY", "INPUT", "TEXTAREA", "SELECT"].includes(focused)) return;
  if (event.target && event.target.isContentEditable === true) return;
  if (event.key === "g") {
    openGoal();
    event.preventDefault();
    return;
  }
  const current = currentEntry(lastView.inbox.open);
  if (current === null) return;
  const { item, state } = current;
  if (event.key === "Enter") {
    if (isBrief(item) ? startApproval(item, state) : start(item, state)) {
      event.preventDefault();
      redraw();
    }
  } else if (/^[1-9]$/.test(event.key)) {
    if (isBrief(item)) return;
    const qi = Math.min(state.q, item.questions.length - 1);
    const oi = Number(event.key) - 1;
    if (oi >= item.questions[qi].options.length) return;
    choose(state, qi, oi);
    state.q = Math.min(qi + 1, item.questions.length - 1);
    event.preventDefault();
    redraw();
  }
});
const conn = document.getElementById("conn");
const source = new EventSource("/api/stream");
source.addEventListener("view", (event) => render(JSON.parse(event.data)));
source.onopen = () => { conn.textContent = ""; };
source.onerror = () => { conn.textContent = "Reconnecting…"; };
